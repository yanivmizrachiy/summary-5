const root=document.getElementById('root');Object.entries(topics).forEach(([id,t],i)=>{const sec=document.createElement('section');sec.id=id;sec.className='topic'+(i===0?' active':'');sec.innerHTML=`<div class="pages">${t.pages.map(f=>`<div class="sheet-shell">${f()}</div>`).join('')}</div>`;root.appendChild(sec)});function fitWorksheetDensity(){
  document.querySelectorAll('.sheet').forEach(sheet=>{
    sheet.classList.remove('fit-airy','fit-compact','fit-dense');
    const stack=sheet.querySelector('.stack');
    if(!stack)return;
    const available=stack.clientHeight;
    let used=stack.scrollHeight;
    if(!available||!used)return;
    if(used>available*1.08){
      sheet.classList.add('fit-compact');
      used=stack.scrollHeight;
      if(used>stack.clientHeight*1.04) sheet.classList.add('fit-dense');
    }else if(used<available*.62){
      sheet.classList.add('fit-airy');
      if(stack.scrollHeight>stack.clientHeight*1.02) sheet.classList.remove('fit-airy');
    }
  });
}
function fitA4Pages(){
  fitWorksheetDensity();
  const mobile=window.matchMedia('(max-width:800px)').matches;
  document.querySelectorAll('.sheet-shell').forEach(shell=>{
    const sheet=shell.querySelector('.sheet');
    if(!sheet)return;
    if(mobile){
      const available=Math.max(280,window.innerWidth-12);
      const scale=Math.min(1,available/794);
      sheet.style.transform=`scale(${scale})`;
      shell.style.width=(794*scale)+'px';
      shell.style.height=(1123*scale)+'px';
    }else{
      sheet.style.transform='';
      shell.style.width='';
      shell.style.height='';
    }
  });
}
function validateSourceA4(){
  document.querySelectorAll('.sheet.source-page').forEach(sheet=>{
    const sr=sheet.getBoundingClientRect();
    const bad=[...sheet.querySelectorAll('*')].filter(node=>{
      const r=node.getBoundingClientRect();
      if(!r.width&&!r.height)return false;
      return r.left<sr.left-1||r.right>sr.right+1||r.top<sr.top-1||r.bottom>sr.bottom+1;
    });
    sheet.dataset.layoutOk=bad.length?'false':'true';
    sheet.dataset.overflowCount=String(bad.length);
  });
}
fitA4Pages();
validateSourceA4();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fitA4Pages();validateSourceA4()});
window.addEventListener('beforeprint',fitWorksheetDensity);
window.addEventListener('resize',fitA4Pages,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(fitA4Pages,100),{passive:true});
document.querySelectorAll('.top button[data-id]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.top button[data-id]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.topic').forEach(x=>x.classList.toggle('active',x.id===b.dataset.id));window.scrollTo({top:0,behavior:'smooth'});requestAnimationFrame(fitA4Pages)});

<script id="double-arrow-property-numbering-v1">
(()=>{
  function clearOld(el){
    el.querySelectorAll(':scope > .prop-index').forEach(x=>x.remove());
    el.dataset.propsNumbered='0';
  }

  function numberList(nodes){
    let i=1;
    nodes.forEach(el=>{
      clearOld(el);
      const span=document.createElement('span');
      span.className='prop-index';
      span.textContent=i+'.';
      el.insertBefore(span, el.firstChild);
      el.dataset.propsNumbered='1';
      i++;
    });
  }

  function directChildren(parent, selector){
    return [...parent.children].filter(el=>el.matches(selector));
  }

  function numberProperties(){
    document.querySelectorAll('.sheet').forEach(sheet=>{
      const tb=[...sheet.querySelectorAll('.tb-property-text')];
      if(tb.length) numberList(tb);

      const p2=[...sheet.querySelectorAll('.p2-text')];
      if(p2.length) numberList(p2);

      sheet.querySelectorAll('.sw-heading').forEach(h=>{
        const t=(h.textContent||'').replace(/\s+/g,' ').trim();
        if(!t.includes('תכונות')) return;
        let sec=h.nextElementSibling;
        if(!sec || !sec.classList.contains('sw-section')) return;
        const items=directChildren(sec,'.sw-text');
        if(items.length) numberList(items);
      });
    });
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',numberProperties,{once:true});
  }else{
    numberProperties();
  }
  window.addEventListener('load',numberProperties,{once:true});
})();
</script>
