<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מרובעים — דפי השלמה</title>
<style>
:root{--ink:#17324d;--muted:#5d7385;--blue:#2563c8;--teal:#168472;--purple:#7653c5;--orange:#df8429;--green:#2d8a55;--line:#d8e3ea;--paper:#fff;--bg:#edf3f7}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Hebrew","Assistant","Arial Hebrew",Arial,sans-serif;line-height:1.52;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.top button{border:1px solid #cddae3;background:#fff;color:#23465f;border-radius:999px;padding:8px 15px;font-weight:850;cursor:pointer}.top button.active{background:#173b57;color:#fff;border-color:#173b57}
.topic{display:none}.topic.active{display:block}.pages{display:grid;gap:26px;padding:26px 12px 60px}.sheet{position:relative;width:min(100%,794px);min-height:1123px;margin:auto;background:#fff;border:1px solid #dfe7ed;border-radius:16px;box-shadow:0 18px 52px rgba(22,48,70,.12);padding:48px 52px 58px;overflow:hidden}.sheet:before{content:"";position:absolute;inset:0 0 auto 0;height:9px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3))}.sheet[data-t="p"]{--c1:#2563c8;--c2:#168472;--c3:#df8429}.sheet[data-t="r"]{--c1:#168472;--c2:#2563c8;--c3:#7653c5}.sheet[data-t="h"]{--c1:#7653c5;--c2:#2563c8;--c3:#df8429}.sheet[data-t="s"]{--c1:#2563c8;--c2:#7653c5;--c3:#168472}
.num{position:absolute;left:20px;top:20px;font-weight:900;color:#7890a1;font-size:13px}.kicker{text-align:center;color:var(--c1);font-weight:900;font-size:14px;margin-bottom:4px}.title{text-align:center;font-weight:950;font-size:43px;line-height:1.05;margin:0;color:#123a58}.sub{text-align:center;color:#607486;font-size:16px;font-weight:800;margin:8px 0 22px}.stack{display:grid;gap:15px}.box{border:1.6px solid #d6e3eb;border-radius:22px;padding:16px 18px;background:#fbfdfe}.def{border-color:#91cfaa;background:#f2fbf5}.prop{border-color:#91b9ea;background:#f4f8ff}.imp{border-color:#f0bd86;background:#fff8f0}.spec{border-color:#c5b2ec;background:#faf7ff}.proof{border-color:#a7bfce;background:#f7fafc}.box h2{font-size:23px;margin:0 0 8px;font-weight:950;color:#173b57}.def h2{color:#2b8250}.prop h2{color:#2361ad}.imp h2{color:#c76f1a}.spec h2{color:#6f48b8}.statement{font-size:19px;font-weight:740;margin:7px 0}.large{font-size:21px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}.card{border:1.3px solid #dbe5eb;border-radius:16px;padding:13px;background:#fff}.card h3{font-size:18px;margin:0 0 6px;color:#244b65}.blank{display:inline-block;min-width:95px;border-bottom:2.5px solid #35566d;height:1.15em;vertical-align:-.08em;margin:0 4px}.blank.short{min-width:62px}.blank.long{min-width:150px}.math{direction:ltr;unicode-bidi:isolate;display:inline-flex;vertical-align:-.13em;white-space:nowrap;font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:1.06em;font-weight:650}.mathline{direction:ltr;unicode-bidi:isolate;text-align:center;border:1px solid #cedde7;background:#fbfdff;border-radius:12px;padding:10px;margin:10px 0;font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:22px}.geo{display:grid;place-items:center;border:1.5px solid #d9e5ec;border-radius:18px;background:linear-gradient(90deg,rgba(216,228,236,.25) 1px,transparent 1px),linear-gradient(rgba(216,228,236,.25) 1px,transparent 1px),#fbfdfe;background-size:22px 22px;min-height:260px;padding:10px}.geo svg{width:min(100%,340px);height:auto}.shape{fill:rgba(37,99,200,.035);stroke:#17324d;stroke-width:4;stroke-linejoin:round}.diag{stroke:#6c8294;stroke-width:2.3}.tick,.par,.right,.arc{fill:none;stroke-linecap:round;stroke-linejoin:round}.tick{stroke:#7653c5;stroke-width:3.2}.par{stroke:#df8429;stroke-width:3}.right{stroke:#168472;stroke-width:3}.arc{stroke:#df8429;stroke-width:2.7}.pt{fill:#17324d}.center{fill:#b35c2b}.lbl{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:20px;font-style:italic;font-weight:700;fill:#0f2e46;paint-order:stroke;stroke:#fff;stroke-width:3px}.list{display:grid;gap:8px}.li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:18px;font-weight:720}.bullet{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eef4f8;font-weight:900}.footer{position:absolute;inset:auto 52px 18px;border-top:1px solid #dbe5eb;padding-top:7px;text-align:center;font-size:11px;color:#7a8d9b;font-weight:700}
@media(max-width:800px){.sheet{border-radius:0;min-height:auto;padding:38px 24px 48px}.title{font-size:36px}.grid2{grid-template-columns:1fr}.statement{font-size:18px}.footer{position:static;margin-top:24px}}
@media print{.top{display:none}.topic{display:none!important}.topic.active{display:block!important}.pages{padding:0;display:block}.sheet{width:210mm;height:297mm;min-height:297mm;margin:0;border:0;border-radius:0;box-shadow:none;break-after:page;padding:12mm 13mm 13mm}.footer{right:13mm;left:13mm;bottom:6mm}@page{size:A4;margin:0}}
</style>
</head>
<body>
<nav class="top" aria-label="נושאים"><button data-id="parallelogram" class="active">מקבילית</button><button data-id="rectangle">מלבן</button><button data-id="rhombus">מעויין</button><button data-id="square">ריבוע</button></nav>
<main id="root"></main>
<script>
const B=(c='')=>`<span class="blank ${c}"></span>`;
const M=s=>`<span class="math">${s}</span>`;
const L=arr=>`<div class="list">${arr.map((x,i)=>`<div class="li"><span class="bullet">${i+1}</span><div>${x}</div></div>`).join('')}</div>`;
function svg(kind,opts={}){const P={parallelogram:{A:[88,58],B:[286,58],C:[242,224],D:[44,224]},rectangle:{A:[62,62],B:[298,62],C:[298,220],D:[62,220]},rhombus:{A:[180,34],B:[312,145],C:[180,256],D:[48,145]},square:{A:[65,40],B:[295,40],C:[295,270],D:[65,270]}}[kind];const pts=[P.A,P.B,P.C,P.D].map(p=>p.join(',')).join(' ');const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];const O=mid(P.A,P.C);let s=`<svg viewBox="0 0 360 310" role="img"><polygon class="shape" points="${pts}"/>`;if(opts.diag)s+=`<line class="diag" x1="${P.A[0]}" y1="${P.A[1]}" x2="${P.C[0]}" y2="${P.C[1]}"/><line class="diag" x1="${P.B[0]}" y1="${P.B[1]}" x2="${P.D[0]}" y2="${P.D[1]}"/>`;if(opts.right){[[P.A,[18,18]],[P.B,[-18,18]],[P.C,[-18,-18]],[P.D,[18,-18]]].forEach(([p,d])=>{s+=`<path class="right" d="M ${p[0]} ${p[1]+d[1]/2} L ${p[0]+d[0]/2} ${p[1]+d[1]/2} L ${p[0]+d[0]/2} ${p[1]}"/>`})}if(opts.equal){[[P.A,P.B],[P.B,P.C],[P.C,P.D],[P.D,P.A]].forEach(([a,b])=>{const m=mid(a,b);const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy),nx=-dy/l,ny=dx/l;s+=`<line class="tick" x1="${m[0]-nx*7}" y1="${m[1]-ny*7}" x2="${m[0]+nx*7}" y2="${m[1]+ny*7}"/>`})}if(opts.parallel){[[P.A,P.B,1],[P.C,P.D,1],[P.B,P.C,2],[P.D,P.A,2]].forEach(([a,b,n])=>{const m=mid(a,b),dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l,nx=-uy,ny=ux;for(let k=0;k<n;k++){let sh=(k-(n-1)/2)*9, cx=m[0]+ux*sh,cy=m[1]+uy*sh;s+=`<path class="par" d="M ${cx-ux*8-nx*5} ${cy-uy*8-ny*5} L ${cx} ${cy} L ${cx-ux*8+nx*5} ${cy-uy*8+ny*5}"/>`}})}if(opts.perp)s+=`<path class="right" d="M ${O[0]} ${O[1]-12} L ${O[0]+12} ${O[1]-12} L ${O[0]+12} ${O[1]}"/>`;if(opts.center)s+=`<circle class="center" cx="${O[0]}" cy="${O[1]}" r="4"/><text class="lbl" x="${O[0]+8}" y="${O[1]-8}">O</text>`;[['A',P.A,-14,-8],['B',P.B,8,-8],['C',P.C,8,22],['D',P.D,-18,22]].forEach(([t,p,dx,dy])=>s+=`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="3"/><text class="lbl" x="${p[0]+dx}" y="${p[1]+dy}">${t}</text>`);return s+'</svg>'}
const GEO=(k,o)=>`<div class="geo">${svg(k,o)}</div>`;
const box=(cls,title,html)=>`<section class="box ${cls}"><h2>${title}</h2>${html}</section>`;
const st=x=>`<p class="statement">${x}</p>`;
const page=(t,n,title,sub,html)=>`<article class="sheet" data-t="${t}"><span class="num">${n}</span><div class="kicker">שאלות מתוך תוכנית הלימודים</div><h1 class="title">${title}</h1><div class="sub">${sub}</div><div class="stack">${html}</div><div class="footer">${title} · עמוד ${n}</div></article>`;
const topics={
parallelogram:{label:'מקבילית',t:'p',pages:[
()=>page('p',1,'מקבילית','הגדרה ותכונות ראשונות',box('def','הגדרה',st(`מקבילית היא מרובע בעל שני זוגות של צלעות נגדיות ${B('long')} זו לזו.`))+`<div class="grid2">${GEO('parallelogram',{parallel:true})}${box('prop','תכונות המקבילית',st(`במקבילית כל זוג צלעות ${B()} מקבילות זו לזו.`)+st(`במקבילית כל שתי ${B()} נגדיות שוות זו לזו.`)+`<div class="mathline">${M('AB ∥ CD')} &nbsp;&nbsp; ${M('AD ∥ BC')}<br>${M('AB = CD')} &nbsp;&nbsp; ${M('AD = BC')}</div>`)}</div>`),
()=>page('p',2,'מקבילית','זוויות ואלכסונים',`<div class="grid2">${GEO('parallelogram',{diag:true,center:true})}${box('prop','תכונות המקבילית',st(`במקבילית האלכסונים ${B()} זה את זה.`)+st(`במקבילית כל שתי זוויות נגדיות ${B()} זו לזו.`)+st(`במקבילית סכום כל שתי זוויות סמוכות שווה ל־${B('short')}.`)+`<div class="mathline">${M('AO = OC')} &nbsp;&nbsp; ${M('BO = OD')}</div>`)}</div>`),
()=>page('p',3,'מקבילית','איך מוכיחים שמרובע הוא מקבילית?',box('proof','משפטי הוכחה',L([`אם במרובע כל זוג צלעות נגדיות ${B()} זו לזו — המרובע הוא מקבילית.`,`אם במרובע כל זוג צלעות ${B()} שוות זו לזו — המרובע הוא מקבילית.`,`אם במרובע כל זוג של זוויות נגדיות ${B()} — המרובע הוא מקבילית.`]))),
()=>page('p',4,'מקבילית','איך מוכיחים שמרובע הוא מקבילית?',box('proof','משפטים נוספים',L([`אם במרובע האלכסונים ${B()} זה את זה — המרובע הוא מקבילית.`,`אם במרובע קיים זוג אחד של צלעות נגדיות שהן גם ${B()} וגם ${B()} — המרובע הוא מקבילית.`]))+`<div class="grid2">${GEO('parallelogram',{diag:true,center:true})}${GEO('parallelogram',{parallel:true})}</div>`),
()=>page('p',5,'מקבילית','איך מחשבים שטח של מקבילית?',`<div class="grid2">${GEO('parallelogram',{})}${box('def','שטח המקבילית',st(`שטח של מקבילית שווה למכפלת אורך הצלע באורך ה${B()} המתאים לצלע זו.`)+`<div class="mathline">${M('S = a · h')}</div>`+st(`גובה במקבילית הוא קטע היוצא מקודקוד ומאונך לצלע שמולו או להמשכה.`))}</div>`)
]},
rectangle:{label:'מלבן',t:'r',pages:[
()=>page('r',1,'מלבן','הגדרה ותכונות המלבן',box('def','הגדרה',st(`מלבן הוא מרובע שבו כל ה${B()} ישרות.`))+`<div class="grid2">${GEO('rectangle',{right:true,parallel:true})}${box('prop','תכונות המלבן',st(`במלבן כל שתי ${B()} נגדיות מקבילות זו לזו.`)+st(`במלבן כל שתי צלעות ${B()} שוות זו לזו.`)+st(`במלבן ה${B()} חוצים זה את זה.`))}</div>`+box('imp','חשוב לדעת',st(`כל התכונות של המקבילית מתקיימות גם ב${B()}.`))),
()=>page('r',2,'מלבן','תכונה מיוחדת של האלכסונים',`<div class="grid2">${GEO('rectangle',{diag:true,center:true})}${box('spec','אלכסוני המלבן',st(`במלבן האלכסונים ${B()} זה לזה.`)+`<div class="mathline">${M('AC = BD')}</div>`+st(`כמו בכל מקבילית, האלכסונים גם ${B()} זה את זה.`))}</div>`),
()=>page('r',3,'מלבן','איך מוכיחים שמרובע הוא מלבן?',box('proof','לפי ההגדרה',st(`אם במרובע יש שלוש זוויות ישרות — המרובע הוא מלבן.`)+st(`גם הזווית הרביעית ישרה כי סכום הזוויות במרובע הוא ${B('short')}.`))+GEO('rectangle',{right:true})),
()=>page('r',4,'מלבן','המלבן הוא מקבילית מיוחדת',box('proof','איך מוכיחים?',L([`אם במקבילית יש ${B()} ישרה — המקבילית היא ${B()}.`,`אם במקבילית האלכסונים ${B()} זה לזה — המקבילית היא ${B()}.`]))+`<div class="grid2">${GEO('rectangle',{right:true})}${GEO('rectangle',{diag:true})}</div>`),
()=>page('r',5,'מלבן','סיכום',box('def','הגדרה',st('מרובע שבו כל הזוויות ישרות הוא מלבן.'))+box('prop','תכונות המלבן',L(['כל שתי צלעות נגדיות מקבילות זו לזו.','כל שתי צלעות נגדיות שוות זו לזו.','האלכסונים חוצים זה את זה.','כל הזוויות ישרות.','האלכסונים שווים זה לזה.']))+box('proof','איך מוכיחים?',L(['לפי הגדרה: שלוש זוויות ישרות מספיקות.','מקבילית שבה זווית אחת ישרה היא מלבן.','מקבילית שאלכסוניה שווים זה לזה היא מלבן.'])))
]},
rhombus:{label:'מעויין',t:'h',pages:[
()=>page('h',1,'מעויין','הגדרה ותכונות ראשונות',box('def','הגדרה',st(`מעויין הוא מרובע שכל ה${B()} שלו שוות זו לזו.`))+`<div class="grid2">${GEO('rhombus',{equal:true,parallel:true})}${box('prop','תכונות המעויין',st(`במעויין כל זוג צלעות ${B()} מקבילות זו לזו.`)+st(`במעויין כל שתי זוויות ${B()} שוות זו לזו.`)+st(`במעויין האלכסונים ${B()} זה את זה.`))}</div>`+box('imp','חשוב לדעת',st(`כל התכונות של המקבילית מתקיימות גם ב${B()}.`))),
()=>page('h',2,'מעויין','תכונות מיוחדות של האלכסונים',`<div class="grid2">${GEO('rhombus',{diag:true,center:true,perp:true})}${box('spec','תכונות מיוחדות',st(`במעויין האלכסונים ${B()} זה לזה.`)+st(`כל אלכסון במעויין ${B()} את שתי הזוויות שבקצותיו.`)+`<div class="mathline">${M('AC ⟂ BD')}</div>`)}</div>`),
()=>page('h',3,'מעויין','איך מוכיחים שמרובע הוא מעויין?',box('proof','משפטי הוכחה',L([`לפי ההגדרה: אם במרובע כל הצלעות ${B()} — המרובע הוא מעויין.`,`אם במקבילית שתי צלעות ${B()} שוות — המקבילית היא מעויין.`]))+GEO('rhombus',{equal:true})),
()=>page('h',4,'מעויין','המעויין הוא מקבילית מיוחדת',box('proof','משפטים נוספים',L([`אם במקבילית האלכסונים ${B()} זה לזה — המקבילית היא מעויין.`,`אם במקבילית אחד האלכסונים חוצה אחת ה${B()} — המקבילית היא מעויין.`]))+`<div class="grid2">${GEO('rhombus',{diag:true,perp:true})}${GEO('rhombus',{diag:true})}</div>`),
()=>page('h',5,'מעויין','איך מחשבים שטח של מעויין?',`<div class="grid2">${box('def','בסיס וגובה',st(`שטח של מעויין שווה למכפלת אורך הצלע באורך ה${B()} לצלע זו.`)+`<div class="mathline">${M('S = a · h')}</div>`)}${box('spec','באמצעות האלכסונים',st(`שטח של מעויין שווה למחצית מכפלת ה${B()}.`)+`<div class="mathline">${M('S = (d₁ · d₂) / 2')}</div>`)}</div>`+GEO('rhombus',{diag:true,perp:true}))
]},
square:{label:'ריבוע',t:'s',pages:[
()=>page('s',1,'ריבוע','הגדרה והקשר למלבן ולמעויין',box('def','הגדרה',st(`ריבוע הוא מרובע שכל צלעותיו ${B()} וכל זוויותיו ${B()}.`))+`<div class="grid2">${GEO('square',{equal:true,right:true,parallel:true})}${box('prop','תכונות ראשונות',st('כל ארבע הצלעות שוות.')+st('כל ארבע הזוויות ישרות.')+st('כל זוג צלעות נגדיות מקבילות זו לזו.'))}</div>`+box('imp','חשוב מאוד',`<div class="grid2"><div class="card"><h3>הריבוע הוא מלבן כי...</h3>${st(`כל הזוויות שלו ${B()}.`)}</div><div class="card"><h3>הריבוע הוא מעויין כי...</h3>${st(`כל הצלעות שלו ${B()}.`)}</div></div>`)),
()=>page('s',2,'ריבוע','מה הריבוע מקבל מהמלבן ומהמעויין?',`<div class="grid2">${box('prop','מהמלבן',st('כל הזוויות ישרות.')+st(`האלכסונים ${B()} זה לזה.`)+`<div class="mathline">${M('AC = BD')}</div>`)}${box('spec','מהמעויין',st('כל הצלעות שוות.')+st(`האלכסונים ${B()} זה לזה.`)+st(`כל אלכסון ${B()} את שתי הזוויות שבקצותיו.`))}</div>`+box('imp','מסקנה',st('הריבוע מקיים את כל תכונות המלבן ואת כל תכונות המעויין.'))),
()=>page('s',3,'ריבוע','תכונות האלכסונים',`<div class="grid2">${GEO('square',{diag:true,center:true,perp:true})}${box('prop','השלימו',st(`האלכסונים ${B()} זה לזה.`)+st(`האלכסונים ${B()} זה לזה.`)+st(`האלכסונים ${B()} זה את זה.`)+st(`כל אלכסון ${B()} את שתי הזוויות שבקצותיו.`)+`<div class="mathline">${M('AC = BD')}<br>${M('AC ⟂ BD')}<br>${M('AO = OC')} &nbsp;&nbsp; ${M('BO = OD')}</div>`)}</div>`),
()=>page('s',4,'ריבוע','איך מוכיחים שמרובע הוא ריבוע?',box('proof','שלוש דרכים',L(['לפי ההגדרה: אם כל הצלעות שוות וכל הזוויות ישרות — המרובע הוא ריבוע.',`אם המרובע הוא מלבן וגם שתי צלעות סמוכות ${B()} — המרובע הוא ריבוע.`,`אם המרובע הוא מעויין וגם האלכסונים ${B()} — המרובע הוא ריבוע.`]))+`<div class="mathline">${M('ABCD מלבן')} + ${M('AB = BC')} ⇒ ${M('ABCD ריבוע')}<br>${M('ABCD מעויין')} + ${M('AC = BD')} ⇒ ${M('ABCD ריבוע')}</div>`),
()=>page('s',5,'ריבוע','סיכום',box('def','הגדרה',st('מרובע שכל צלעותיו שוות וכל זוויותיו ישרות הוא ריבוע.'))+box('prop','תכונות הריבוע',L(['כל ארבע הצלעות שוות.','כל ארבע הזוויות ישרות.','הצלעות הנגדיות מקבילות.','האלכסונים חוצים זה את זה.','האלכסונים שווים זה לזה.','האלכסונים מאונכים זה לזה.','כל אלכסון חוצה את שתי הזוויות שבקצותיו.']))+`<div class="grid2"><div class="card"><h3>ריבוע הוא מלבן</h3>${st('כי כל הזוויות שלו ישרות.')}</div><div class="card"><h3>ריבוע הוא מעויין</h3>${st('כי כל הצלעות שלו שוות.')}</div></div>`)
]}
};
const root=document.getElementById('root');Object.entries(topics).forEach(([id,t],i)=>{const sec=document.createElement('section');sec.id=id;sec.className='topic'+(i===0?' active':'');sec.innerHTML=`<div class="pages">${t.pages.map(f=>f()).join('')}</div>`;root.appendChild(sec)});document.querySelectorAll('.top button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.top button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.topic').forEach(x=>x.classList.toggle('active',x.id===b.dataset.id));window.scrollTo({top:0,behavior:'smooth'})});
</script>
