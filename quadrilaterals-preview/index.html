<style>

*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Hebrew","Rubik","Assistant","Arial Hebrew","Segoe UI",Arial,sans-serif;line-height:1.52;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-kerning:normal;font-synthesis:none;font-feature-settings:"kern" 1,"liga" 1}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.top button{border:1px solid #cddae3;background:#fff;color:#23465f;border-radius:999px;padding:8px 15px;font-weight:850;cursor:pointer}.top button.active{background:#173b57;color:#fff;border-color:#173b57}
.topic{display:none}.topic.active{display:block}.pages{display:grid;gap:26px;padding:26px 12px 60px}.sheet{position:relative;width:min(100%,794px);min-height:1123px;margin:auto;background:#fff;border:1px solid #dfe7ed;border-radius:16px;box-shadow:0 18px 52px rgba(22,48,70,.12);padding:48px 52px 58px;overflow:hidden}.sheet:before{content:"";position:absolute;inset:0 0 auto 0;height:9px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3))}.sheet[data-t="p"]{--c1:#2563c8;--c2:#168472;--c3:#df8429}.sheet[data-t="r"]{--c1:#168472;--c2:#2563c8;--c3:#7653c5}.sheet[data-t="h"]{--c1:#7653c5;--c2:#2563c8;--c3:#df8429}.sheet[data-t="s"]{--c1:#2563c8;--c2:#7653c5;--c3:#168472}
.num{position:absolute;left:20px;top:20px;font-weight:900;color:#7890a1;font-size:13px}.kicker{text-align:center;color:var(--c1);font-weight:900;font-size:14px;margin-bottom:4px}.title{text-align:center;font-weight:950;font-size:43px;line-height:1.05;margin:0;color:#123a58}.sub{text-align:center;color:#607486;font-size:16px;font-weight:800;margin:8px 0 22px}.stack{display:grid;gap:15px}.box{border:1.6px solid #d6e3eb;border-radius:22px;padding:16px 18px;background:#fbfdfe}.def{border-color:#91cfaa;background:#f2fbf5}.prop{border-color:#91b9ea;background:#f4f8ff}.imp{border-color:#f0bd86;background:#fff8f0}.spec{border-color:#c5b2ec;background:#faf7ff}.proof{border-color:#a7bfce;background:#f7fafc}.box h2{font-size:23px;margin:0 0 8px;font-weight:950;color:#173b57}.box>p:first-child{margin-top:0}.box>p:last-child{margin-bottom:0}.def h2{color:#2b8250}.prop h2{color:#2361ad}.imp h2{color:#c76f1a}.spec h2{color:#6f48b8}.statement{font-size:19px;font-weight:740;margin:7px 0}.large{font-size:21px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}.card{border:1.3px solid #dbe5eb;border-radius:16px;padding:13px;background:#fff}.card h3{font-size:18px;margin:0 0 6px;color:#244b65}.blank{display:inline-block;min-width:95px;border-bottom:2.5px solid #35566d;height:1.15em;vertical-align:-.08em;margin:0 4px}.blank.short{min-width:62px}.blank.long{min-width:150px}.math{direction:ltr;unicode-bidi:isolate;display:inline-flex;vertical-align:-.13em;white-space:nowrap;font-family:"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif;font-size:1.06em;font-weight:600}.mathline{direction:ltr;unicode-bidi:isolate;text-align:center;border:1px solid #cedde7;background:#fbfdff;border-radius:12px;padding:10px;margin:10px 0;font-family:"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif;font-size:22px}.mathline.mixed{direction:rtl;unicode-bidi:plaintext}.mathline math,.math math{font-family:"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif;font-size:1em}.geo{display:grid;place-items:center;margin:0;border:1.5px solid #d9e5ec;border-radius:18px;background:linear-gradient(90deg,rgba(216,228,236,.25) 1px,transparent 1px),linear-gradient(rgba(216,228,236,.25) 1px,transparent 1px),#fbfdfe;background-size:22px 22px;min-height:260px;padding:10px}.geo svg{width:min(100%,350px);height:auto;overflow:visible}.geo figcaption{font-size:12px;color:#6c7f8d;font-weight:700;text-align:center;margin-top:6px}.shape{fill:rgba(37,99,200,.035);stroke:#17324d;stroke-width:4;stroke-linejoin:round}.diag{stroke:#6c8294;stroke-width:2.3}.tick,.par,.right,.arc,.height,.extension{fill:none;stroke-linecap:round;stroke-linejoin:round}.tick{stroke:#7653c5;stroke-width:3.2}.par{stroke:#df8429;stroke-width:3}.right{stroke:#168472;stroke-width:3}.arc{stroke:#df8429;stroke-width:2.7}.height{stroke:#168472;stroke-width:2.7;stroke-dasharray:7 5}.extension{stroke:#9aabb7;stroke-width:1.8;stroke-dasharray:4 5}.diag-eq{stroke:#b35c2b;stroke-width:3.1;stroke-linecap:round}.mid-a{stroke:#2563c8;stroke-width:3.1}.mid-b{stroke:#168472;stroke-width:3.1}.pt{fill:#17324d}.center{fill:#b35c2b}.lbl{font-family:"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif;font-size:20px;font-style:italic;font-weight:700;fill:#0f2e46;paint-order:stroke;stroke:#fff;stroke-width:3px}.list{display:grid;gap:8px}.li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:18px;font-weight:720}.bullet{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eef4f8;font-weight:900}.footer{position:absolute;inset:auto 52px 18px;border-top:1px solid #dbe5eb;padding-top:7px;text-align:center;font-size:11px;color:#7a8d9b;font-weight:700}
@media(max-width:800px){.sheet{border-radius:0;min-height:auto;padding:38px 24px 48px}.title{font-size:36px}.grid2{grid-template-columns:1fr}.statement{font-size:18px}.footer{position:static;margin-top:24px}}
@media print{html,body{background:#fff!important}.top{display:none}.topic{display:none!important}.topic.active{display:block!important}.pages{padding:0;display:block}.sheet{width:210mm;height:297mm;min-height:297mm;max-height:297mm;margin:0;border:0;border-radius:0;box-shadow:none;break-after:page;page-break-after:always;padding:7mm 8mm 8mm;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}.sheet:before{height:2.2mm}.kicker{font-size:9.5pt;margin-bottom:1mm}.title{font-size:30pt;line-height:1;margin-bottom:3mm}.stack{gap:3mm}.box{padding:3.2mm 4mm;border-radius:4.5mm}.box h2{font-size:16.5pt;margin-bottom:1.5mm}.statement{font-size:13.3pt;line-height:1.34;margin:1.2mm 0}.large{font-size:14.5pt}.grid2{gap:3mm}.card{padding:3mm}.card h3{font-size:13.5pt}.geo{min-height:55mm;padding:2mm;border-radius:4mm}.geo svg{width:min(100%,88mm);max-height:55mm}.geo figcaption{display:none}.mathline{font-size:16pt;padding:2mm;margin:2mm 0}.list{gap:1.8mm}.li{font-size:13pt;line-height:1.3;grid-template-columns:7mm 1fr;gap:2mm}.bullet{width:6.5mm;height:6.5mm}.blank{min-width:24mm}.blank.short{min-width:16mm}.blank.long{min-width:38mm}.footer{right:8mm;left:8mm;bottom:2.5mm;padding-top:1.5mm;font-size:8pt}.num{left:6mm;top:5mm;font-size:9pt}@page{size:A4;margin:0}}
</style>
</head>
<body>
<nav class="top" aria-label="נושאים"><button data-id="parallelogram" class="active">מקבילית</button><button data-id="rectangle">מלבן</button><button data-id="rhombus">מעויין</button><button data-id="square">ריבוע</button></nav>
<main id="root"></main>
<script>
const B=(c='')=>`<span class="blank ${c}" aria-hidden="true"></span>`;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const M=s=>{
  const str=String(s).trim();
  if(/[\u0590-\u05FF]/.test(str)) return `<bdi class="math" dir="ltr">${esc(str)}</bdi>`;
  if(str==='S = (d₁ · d₂) / 2') return `<span class="math"><math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>S</mi><mo>=</mo><mfrac><mrow><msub><mi>d</mi><mn>1</mn></msub><mo>·</mo><msub><mi>d</mi><mn>2</mn></msub></mrow><mn>2</mn></mfrac></mrow></math></span>`;
  const toks=str.match(/d[₁₂]|[A-Za-z]+|\d+°?|[=∥⟂·+⇒()]/g)||[str];
  const parts=toks.map(t=>{
    if(t==='d₁'||t==='d₂') return `<msub><mi>d</mi><mn>${t==='d₁'?'1':'2'}</mn></msub>`;
    if(/^[A-Za-z]+$/.test(t)) return `<mi>${t}</mi>`;
    if(/^\d+°?$/.test(t)) return t.endsWith('°')?`<mrow><mn>${t.slice(0,-1)}</mn><mo>°</mo></mrow>`:`<mn>${t}</mn>`;
    return `<mo>${esc(t)}</mo>`;
  }).join('');
  return `<span class="math"><math xmlns="http://www.w3.org/1998/Math/MathML"><mrow>${parts}</mrow></math></span>`;
};
const L=arr=>`<div class="list">${arr.map((x,i)=>`<div class="li"><span class="bullet">${i+1}</span><div>${x}</div></div>`).join('')}</div>`;

const V={sub:(a,b)=>[a[0]-b[0],a[1]-b[1]],add:(a,b)=>[a[0]+b[0],a[1]+b[1]],mul:(a,s)=>[a[0]*s,a[1]*s],dot:(a,b)=>a[0]*b[0]+a[1]*b[1],cross:(a,b)=>a[0]*b[1]-a[1]*b[0],len:a=>Math.hypot(a[0],a[1]),mid:(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2]};
const unit=a=>{const l=V.len(a)||1;return [a[0]/l,a[1]/l]};
const normal=(a,b)=>{const u=unit(V.sub(b,a));return[-u[1],u[0]]};
const pt=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const dist=(a,b)=>V.len(V.sub(a,b));
const parallel=(u,v)=>Math.abs(V.cross(u,v))<1e-7*Math.max(1,V.len(u)*V.len(v));
const perp=(u,v)=>Math.abs(V.dot(u,v))<1e-7*Math.max(1,V.len(u)*V.len(v));
const approx=(a,b)=>Math.abs(a-b)<1e-7*Math.max(1,Math.abs(a),Math.abs(b));
const MODELS=Object.freeze({
 parallelogram:Object.freeze({A:[88,58],B:[286,58],C:[242,224],D:[44,224]}),
 rectangle:Object.freeze({A:[62,62],B:[298,62],C:[298,220],D:[62,220]}),
 rhombus:Object.freeze({A:[180,34],B:[312,145],C:[180,256],D:[48,145]}),
 square:Object.freeze({A:[65,40],B:[295,40],C:[295,270],D:[65,270]})
});
function validateModel(kind,P){
 const AB=V.sub(P.B,P.A),BC=V.sub(P.C,P.B),CD=V.sub(P.D,P.C),DA=V.sub(P.A,P.D);
 const sides=[dist(P.A,P.B),dist(P.B,P.C),dist(P.C,P.D),dist(P.D,P.A)];
 if(!parallel(AB,CD)||!parallel(BC,DA)) throw new Error(`geometry:${kind}:parallel`);
 if((kind==='rectangle'||kind==='square')&&!perp(AB,BC)) throw new Error(`geometry:${kind}:right`);
 if((kind==='rhombus'||kind==='square')&&!(approx(sides[0],sides[1])&&approx(sides[1],sides[2])&&approx(sides[2],sides[3]))) throw new Error(`geometry:${kind}:equal-sides`);
 if(kind==='rectangle'||kind==='square'){if(!approx(dist(P.A,P.C),dist(P.B,P.D)))throw new Error(`geometry:${kind}:equal-diagonals`)}
 if(kind==='rhombus'||kind==='square'){if(!perp(V.sub(P.C,P.A),V.sub(P.D,P.B)))throw new Error(`geometry:${kind}:perp-diagonals`)}
}
Object.entries(MODELS).forEach(([k,p])=>validateModel(k,p));
function slash(a,b,t,count,cls){const c=pt(a,b,t),u=unit(V.sub(b,a)),n=normal(a,b),gap=7;let out='';for(let i=0;i<count;i++){const sh=(i-(count-1)/2)*gap;const q=V.add(c,V.mul(u,sh));out+=`<line class="${cls}" x1="${q[0]-n[0]*7}" y1="${q[1]-n[1]*7}" x2="${q[0]+n[0]*7}" y2="${q[1]+n[1]*7}"/>`}return out}
function chevrons(a,b,count){const m=V.mid(a,b),u=unit(V.sub(b,a)),n=normal(a,b);let out='';for(let k=0;k<count;k++){const sh=(k-(count-1)/2)*10,c=V.add(m,V.mul(u,sh));out+=`<path class="par" d="M ${c[0]-u[0]*8-n[0]*5} ${c[1]-u[1]*8-n[1]*5} L ${c[0]} ${c[1]} L ${c[0]-u[0]*8+n[0]*5} ${c[1]-u[1]*8+n[1]*5}"/>`}return out}
function projection(p,a,b){const ab=V.sub(b,a),t=V.dot(V.sub(p,a),ab)/V.dot(ab,ab);return {q:V.add(a,V.mul(ab,t)),t}}
function angleArc(vertex,a,b,r=24){const u=unit(V.sub(a,vertex)),v=unit(V.sub(b,vertex));const p1=V.add(vertex,V.mul(u,r)),p2=V.add(vertex,V.mul(v,r));return `<path class="arc" d="M ${p1[0]} ${p1[1]} Q ${vertex[0]} ${vertex[1]} ${p2[0]} ${p2[1]}"/>`}
function rightMark(p,u,v,size=12,cls='right'){const a=unit(u),b=unit(v),p1=V.add(p,V.mul(a,size)),p2=V.add(p1,V.mul(b,size)),p3=V.add(p,V.mul(b,size));return `<path class="${cls}" d="M ${p1[0]} ${p1[1]} L ${p2[0]} ${p2[1]} L ${p3[0]} ${p3[1]}"/>`}
function svg(kind,opts={}){
 const P=MODELS[kind], pts=[P.A,P.B,P.C,P.D].map(p=>p.join(',')).join(' '), O=V.mid(P.A,P.C);
 const label={parallelogram:'מקבילית',rectangle:'מלבן',rhombus:'מעויין',square:'ריבוע'}[kind];
 let s=`<figure class="geo"><svg viewBox="0 0 360 310" role="img" aria-label="${label} ABCD עם סימונים גאומטריים מדויקים"><polygon class="shape" points="${pts}"/>`;
 if(opts.diag)s+=`<line class="diag" x1="${P.A[0]}" y1="${P.A[1]}" x2="${P.C[0]}" y2="${P.C[1]}"/><line class="diag" x1="${P.B[0]}" y1="${P.B[1]}" x2="${P.D[0]}" y2="${P.D[1]}"/>`;
 if(opts.right){[[P.A,[18,18]],[P.B,[-18,18]],[P.C,[-18,-18]],[P.D,[18,-18]]].forEach(([p,d])=>s+=`<path class="right" d="M ${p[0]} ${p[1]+d[1]/2} L ${p[0]+d[0]/2} ${p[1]+d[1]/2} L ${p[0]+d[0]/2} ${p[1]}"/>`)}
 if(opts.equal){[[P.A,P.B],[P.B,P.C],[P.C,P.D],[P.D,P.A]].forEach(([a,b])=>s+=slash(a,b,.5,1,'tick'))}
 if(opts.oppEqual){s+=slash(P.A,P.B,.5,1,'tick')+slash(P.C,P.D,.5,1,'tick')+slash(P.B,P.C,.5,2,'tick')+slash(P.D,P.A,.5,2,'tick')}
 if(opts.parallel){s+=chevrons(P.A,P.B,1)+chevrons(P.C,P.D,1)+chevrons(P.B,P.C,2)+chevrons(P.D,P.A,2)}
 if(opts.perp)s+=rightMark(O,V.sub(P.A,O),V.sub(P.B,O),12);
 if(opts.midpoints&&opts.diag){s+=slash(P.A,P.C,.27,1,'mid-a')+slash(P.A,P.C,.73,1,'mid-a')+slash(P.B,P.D,.27,2,'mid-b')+slash(P.B,P.D,.73,2,'mid-b')}
 if(opts.equalDiags&&opts.diag){s+=slash(P.A,P.C,.19,1,'diag-eq')+slash(P.B,P.D,.19,1,'diag-eq')}
 if(opts.angleBisectors&&opts.diag){s+=angleArc(P.A,P.B,O,25)+angleArc(P.A,O,P.D,25)+angleArc(P.C,P.D,O,25)+angleArc(P.C,O,P.B,25);if(opts.angleBisectors!=='ac')s+=angleArc(P.B,P.A,O,25)+angleArc(P.B,O,P.C,25)+angleArc(P.D,P.C,O,25)+angleArc(P.D,O,P.A,25)}
 if(opts.height){const {q,t}=projection(P.C,P.A,P.B);if(t<0||t>1)s+=`<line class="extension" x1="${P.A[0]}" y1="${P.A[1]}" x2="${q[0]}" y2="${q[1]}"/>`;s+=`<line class="height" x1="${P.C[0]}" y1="${P.C[1]}" x2="${q[0]}" y2="${q[1]}"/>`+rightMark(q,V.sub(P.A,q),V.sub(P.C,q),10)+`<text class="lbl" x="${(P.C[0]+q[0])/2+8}" y="${(P.C[1]+q[1])/2}">h</text>`}
 if(opts.center)s+=`<circle class="center" cx="${O[0]}" cy="${O[1]}" r="4"/><text class="lbl" x="${O[0]+8}" y="${O[1]-8}">O</text>`;
 [['A',P.A,-14,-8],['B',P.B,8,-8],['C',P.C,8,22],['D',P.D,-18,22]].forEach(([t,p,dx,dy])=>s+=`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="3"/><text class="lbl" x="${p[0]+dx}" y="${p[1]+dy}">${t}</text>`);
 return s+`</svg></figure>`;
}
const GEO=(k,o)=>svg(k,o);
const box=(cls,title,html)=>`<section class="box ${cls}">${title?`<h2>${title}</h2>`:""}${html}</section>`;
const st=x=>`<p class="statement">${x}</p>`;
const page=(t,n,title,sub,html)=>`<article class="sheet" data-t="${t}"><span class="num">${n}</span><div class="kicker">שאלות מתוך תוכנית הלימודים</div><h1 class="title">${title}</h1><div class="stack">${html}</div><div class="footer">${n}</div></article>`;
const topics={
parallelogram:{label:'מקבילית',t:'p',pages:[
()=>page('p',1,'מקבילית','הגדרה ותכונות ראשונות',box('def','הגדרה',st(`מקבילית היא מרובע בעל שני זוגות של צלעות נגדיות ${B('long')} זו לזו.`))+`<div class="grid2">${GEO('parallelogram',{parallel:true,oppEqual:true})}${box('prop','תכונות המקבילית',st(`במקבילית כל זוג צלעות ${B()} מקבילות זו לזו.`)+st(`במקבילית כל שתי ${B()} נגדיות שוות זו לזו.`)+`<div class="mathline">${M('AB ∥ CD')} &nbsp;&nbsp; ${M('AD ∥ BC')}<br>${M('AB = CD')} &nbsp;&nbsp; ${M('AD = BC')}</div>`)}</div>`),
()=>page('p',2,'מקבילית','זוויות ואלכסונים',`<div class="grid2">${GEO('parallelogram',{diag:true,center:true,midpoints:true})}${box('prop','תכונות המקבילית',st(`במקבילית האלכסונים ${B()} זה את זה.`)+st(`במקבילית כל שתי זוויות נגדיות ${B()} זו לזו.`)+st(`במקבילית סכום כל שתי זוויות ${B()} שווה ל - ${B('short')}.`)+`<div class="mathline">${M('AO = OC')} &nbsp;&nbsp; ${M('BO = OD')}</div>`)}</div>`),
()=>page('p',3,'מקבילית','איך מוכיחים שמרובע הוא מקבילית?',box('proof','איך מוכיחים שמרובע הוא מקבילית?',L([`לפי הגדרה: אם במרובע כל זוג צלעות נגדיות הן ${B()} זו לזו, אז המרובע הוא מקבילית.`,`אם במרובע כל זוג של צלעות ${B()} הן שוות זו לזו, אז המרובע הוא ${B()}.`,`אם במרובע כל זוג של זוויות נגדיות ${B()}, אז המרובע הוא מקבילית.`]))),
()=>page('p',4,'מקבילית','איך מוכיחים שמרובע הוא מקבילית?',box('proof','איך מוכיחים שמרובע הוא מקבילית?',L([`אם במרובע האלכסונים ${B()} זה את זה, אז המרובע הוא ${B()}.`,`אם במרובע קיים זוג אחד של צלעות נגדיות שהן גם ${B()} וגם ${B()}, אז המרובע הוא ${B()}.`]))+`<div class="grid2">${GEO('parallelogram',{diag:true,center:true,midpoints:true})}${GEO('parallelogram',{parallel:true,oppEqual:true})}</div>`),
()=>page('p',5,'מקבילית','איך מחשבים שטח של מקבילית?',`<div class="grid2">${GEO('parallelogram',{height:true})}${box('def','איך מחשבים שטח של מקבילית?',st(`שטח של מקבילית שווה למכפלת צלע המקבילית באורך ה${B()} לצלע זו.`)+`<div class="mathline">${M('S = a · h')}</div>`)}</div>`)
]},
rectangle:{label:'מלבן',t:'r',pages:[

const root=document.getElementById('root');Object.entries(topics).forEach(([id,t],i)=>{const sec=document.createElement('section');sec.id=id;sec.className='topic'+(i===0?' active':'');sec.innerHTML=`<div class="pages">${t.pages.map(f=>f()).join('')}</div>`;root.appendChild(sec)});document.querySelectorAll('.top button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.top button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.topic').forEach(x=>x.classList.toggle('active',x.id===b.dataset.id));window.scrollTo({top:0,behavior:'smooth'})});
