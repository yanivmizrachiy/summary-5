<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מרובעים — דפי השלמה</title>
<style>
:root{--ink:#17324d;--muted:#5d7385;--blue:#2563c8;--teal:#168472;--purple:#7653c5;--orange:#df8429;--green:#2d8a55;--line:#d8e3ea;--paper:#fff;--bg:#edf3f7}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Hebrew","Rubik","Assistant","Arial Hebrew","Segoe UI",Arial,sans-serif;line-height:1.52;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-kerning:normal;font-synthesis:none;font-feature-settings:"kern" 1,"liga" 1}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.top button{border:1px solid #cddae3;background:#fff;color:#23465f;border-radius:999px;padding:8px 15px;font-weight:850;cursor:pointer}.top button.active{background:#173b57;color:#fff;border-color:#173b57}.top .print-a4{background:#173b57;color:#fff;border-color:#173b57;margin-inline-start:8px}
.topic{display:none}.topic.active{display:block}.pages{display:grid;gap:26px;padding:26px 12px 60px}.sheet{position:relative;width:794px;height:1123px;min-height:1123px;max-height:1123px;margin:auto;background:#fff;border:1px solid #dfe7ed;border-radius:8px;box-shadow:0 12px 34px rgba(22,48,70,.12);padding:28px 32px 34px;overflow:hidden}.sheet:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c1)}.sheet[data-t="p"]{--c1:#2563c8;--c2:#168472;--c3:#df8429}.sheet[data-t="r"]{--c1:#168472;--c2:#2563c8;--c3:#7653c5}.sheet[data-t="h"]{--c1:#7653c5;--c2:#2563c8;--c3:#df8429}.sheet[data-t="s"]{--c1:#2563c8;--c2:#7653c5;--c3:#168472}
.num{position:absolute;left:18px;top:14px;font-weight:800;color:#8a9aa6;font-size:10px}
.kicker{text-align:right;color:var(--c1);font-weight:800;font-size:10px;line-height:1.1;margin:0 0 2px}
.title{text-align:center;font-weight:950;font-size:32px;line-height:1;margin:0 0 8px;color:#123a58}
.sub{display:none}
.stack{height:calc(100% - 62px);display:flex;flex-direction:column;gap:9px;padding-bottom:16px}
.stack>.grid2:only-child{flex:1;min-height:0}
.stack>.grid2:only-child>.geo{height:100%;min-height:0}
.stack>.box:only-child{margin-block:auto}
.box{border:0;border-inline-start:4px solid #a8bac6;border-bottom:1px solid #e2e9ee;border-radius:0;padding:8px 10px;background:transparent}
.def{border-inline-start-color:#5aa678}.prop{border-inline-start-color:#5b8fd1}.imp{border-inline-start-color:#d99a4f}.spec{border-inline-start-color:#866bc6}.proof{border-inline-start-color:#789aaa}
.box h2{font-size:19px;line-height:1.12;margin:0 0 4px;font-weight:950;color:#173b57}
.box>p:first-child{margin-top:0}.box>p:last-child{margin-bottom:0}
.box,.card,.geo,.mathline{break-inside:avoid;page-break-inside:avoid}
.def h2{color:#2b8250}.prop h2{color:#2361ad}.imp h2{color:#b96b1f}.spec h2{color:#6f48b8}
.statement{font-size:18px;line-height:1.33;font-weight:690;margin:3px 0}
.large{font-size:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:stretch}
.card{border:0;border-bottom:1px solid #dde6ec;padding:8px 10px;background:transparent}
.card h3{font-size:17px;line-height:1.15;margin:0 0 4px;color:#244b65}
.blank{display:inline-block;min-width:102px;border-bottom:2.2px solid #35566d;height:1.08em;vertical-align:-.08em;margin:0 3px}
.blank.short{min-width:64px}.blank.long{min-width:150px}
.math{direction:ltr;unicode-bidi:isolate;display:inline-flex;vertical-align:-.13em;white-space:nowrap;font-family:"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif;font-size:1.05em;font-weight:600}
.mathline{direction:ltr;unicode-bidi:isolate;text-align:center;border:0;background:transparent;padding:2px;margin:3px 0;font-family:"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif;font-size:21px;line-height:1.18}
.mathline.mixed{direction:rtl;unicode-bidi:plaintext}
.source-symbolic{direction:ltr;unicode-bidi:isolate;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:7px 0;font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:20px;text-align:center}
.source-symbolic .and{direction:rtl;font-family:"Noto Sans Hebrew","Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;font-size:15px;font-weight:800}
.mathline math,.math math{font-family:"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif;font-size:1em}
.geo{display:grid;place-items:center;margin:0;border:0;background:#fff;min-height:220px;padding:2px}
.geo svg{width:min(100%,350px);max-height:230px;height:auto;overflow:visible}
.geo figcaption{display:none}
.shape{fill:rgba(37,99,200,.018);stroke:#17324d;stroke-width:4;stroke-linejoin:round}
.diag{stroke:#6c8294;stroke-width:2.3}
.tick,.par,.right,.arc,.height,.extension{fill:none;stroke-linecap:round;stroke-linejoin:round}
.tick{stroke:#7653c5;stroke-width:3.2}.par{stroke:#df8429;stroke-width:3}.right{stroke:#168472;stroke-width:3}.arc{stroke:#df8429;stroke-width:2.7}
.height{stroke:#168472;stroke-width:2.7;stroke-dasharray:7 5}.extension{stroke:#9aabb7;stroke-width:1.8;stroke-dasharray:4 5}
.diag-eq{stroke:#b35c2b;stroke-width:3.1;stroke-linecap:round}.mid-a{stroke:#2563c8;stroke-width:3.1}.mid-b{stroke:#168472;stroke-width:3.1}
.pt{fill:#17324d}.center{fill:#b35c2b}
.lbl{font-family:"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif;font-size:20px;font-style:italic;font-weight:700;fill:#0f2e46;paint-order:stroke;stroke:#fff;stroke-width:3px}
.list{display:grid;gap:5px}
.li{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;font-size:17px;line-height:1.3;font-weight:690}
.bullet{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#eef4f8;font-size:11px;font-weight:900}
.footer{position:absolute;inset:auto 28px 7px;border:0;padding:0;text-align:center;font-size:9px;color:#8a9aa6;font-weight:700}

/* Density classes are applied automatically from the real rendered height. */
.sheet.fit-compact .statement{font-size:17px;line-height:1.28}
.sheet.fit-compact .box{padding:6px 9px}
.sheet.fit-compact .box h2{font-size:18px;margin-bottom:3px}
.sheet.fit-compact .grid2{gap:9px}
.sheet.fit-compact .geo{min-height:190px}
.sheet.fit-compact .geo svg{max-height:200px}
.sheet.fit-compact .list{gap:3px}
.sheet.fit-compact .li{font-size:16px;line-height:1.24}
.sheet.fit-dense .statement{font-size:16px;line-height:1.22;margin:2px 0}
.sheet.fit-dense .box{padding:5px 8px}
.sheet.fit-dense .box h2{font-size:17px}
.sheet.fit-dense .geo{min-height:170px}
.sheet.fit-dense .geo svg{max-height:178px}
.sheet.fit-dense .li{font-size:15px;line-height:1.2}
.sheet.fit-airy .statement{font-size:20px}
.sheet.fit-airy .geo{min-height:300px}
.sheet.fit-airy .geo svg{max-height:315px;width:min(100%,410px)}
.sheet.fit-airy .mathline{font-size:24px}
@media(max-width:800px){
body{overflow-x:hidden}
.top{position:sticky;top:0;padding:6px 4px;gap:4px}
.top button{padding:6px 9px;font-size:12px}
.top .print-a4{margin-inline-start:0}
.pages{gap:14px;padding:10px 0 26px}
.sheet-shell{position:relative;margin:0 auto;overflow:visible}
.sheet{width:794px!important;height:1123px!important;min-height:1123px!important;max-height:1123px!important;margin:0!important;transform-origin:top left;border-radius:7px!important;box-shadow:0 7px 20px rgba(22,48,70,.14)}
.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
}
@media print{
html,body{width:210mm!important;min-width:210mm!important;margin:0!important;padding:0!important;background:#fff!important}
body{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
.top{display:none!important}.topic{display:none!important}.topic.active{display:block!important}
.pages{display:block!important;margin:0!important;padding:0!important}
.sheet-shell{width:210mm!important;height:297mm!important;margin:0!important;overflow:visible!important}
.sheet{width:210mm!important;height:297mm!important;min-height:297mm!important;max-height:297mm!important;transform:none!important;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;break-after:page!important;page-break-after:always!important}
.sheet:last-child{break-after:auto!important;page-break-after:auto!important}
@page{size:A4 portrait;margin:0}
}
</style>
</head>
<body>
<nav class="top" aria-label="נושאים"><button data-id="parallelogram" class="active">מקבילית</button><button data-id="rectangle">מלבן</button><button data-id="rhombus">מעויין</button><button data-id="square">ריבוע</button><button class="print-a4" type="button" onclick="window.print()">הדפסת A4</button></nav>
<main id="root"></main>
<script>
const B=(c='')=>`<span class="blank ${c}" aria-hidden="true"></span>`;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const M=s=>{
  const str=String(s).trim();
  if(/[\u0590-\u05FF]/.test(str)) return `<bdi class="math" dir="ltr">${esc(str)}</bdi>`;
  if(str==='S = (d₁ · d₂) / 2') return `<span class="math"><math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>S</mi><mo>=</mo><mfrac><mrow><msub><mi>d</mi><mn>1</mn></msub><mo>·</mo><msub><mi>d</mi><mn>2</mn></msub></mrow><mn>2</mn></mfrac></mrow></math></span>`;
  const toks=str.match(/d[₁₂]|[A-Za-z]+|\d+°?|[=∥⟂·+⇒()]/g)||[str];
  const parts=toks.map(t=>{
    if(t==='d₁'||t==='d₂') return `<msub><mi>d</mi><mn>${t==='d₁'?'1':'2'}</mn></msub>`;
    if(/^[A-Za-z]+$/.test(t)) return `<mi>${t}</mi>`;
    if(/^\d+°?$/.test(t)) return t.endsWith('°')?`<mrow><mn>${t.slice(0,-1)}</mn><mo>°</mo></mrow>`:`<mn>${t}</mn>`;
    return `<mo>${esc(t)}</mo>`;
  }).join('');
  return `<span class="math"><math xmlns="http://www.w3.org/1998/Math/MathML"><mrow>${parts}</mrow></math></span>`;
};
const L=arr=>`<div class="list">${arr.map((x,i)=>`<div class="li"><span class="bullet">${i+1}</span><div>${x}</div></div>`).join('')}</div>`;

const V={sub:(a,b)=>[a[0]-b[0],a[1]-b[1]],add:(a,b)=>[a[0]+b[0],a[1]+b[1]],mul:(a,s)=>[a[0]*s,a[1]*s],dot:(a,b)=>a[0]*b[0]+a[1]*b[1],cross:(a,b)=>a[0]*b[1]-a[1]*b[0],len:a=>Math.hypot(a[0],a[1]),mid:(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2]};
const unit=a=>{const l=V.len(a)||1;return [a[0]/l,a[1]/l]};
const normal=(a,b)=>{const u=unit(V.sub(b,a));return[-u[1],u[0]]};
const pt=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const dist=(a,b)=>V.len(V.sub(a,b));
const parallel=(u,v)=>Math.abs(V.cross(u,v))<1e-7*Math.max(1,V.len(u)*V.len(v));
const perp=(u,v)=>Math.abs(V.dot(u,v))<1e-7*Math.max(1,V.len(u)*V.len(v));
const approx=(a,b)=>Math.abs(a-b)<1e-7*Math.max(1,Math.abs(a),Math.abs(b));
const MODELS=Object.freeze({
 parallelogram:Object.freeze({A:[88,58],B:[286,58],C:[242,224],D:[44,224]}),
 rectangle:Object.freeze({A:[62,62],B:[298,62],C:[298,220],D:[62,220]}),
 rhombus:Object.freeze({A:[180,34],B:[312,145],C:[180,256],D:[48,145]}),
 square:Object.freeze({A:[65,40],B:[295,40],C:[295,270],D:[65,270]})
});
function validateModel(kind,P){
 const AB=V.sub(P.B,P.A),BC=V.sub(P.C,P.B),CD=V.sub(P.D,P.C),DA=V.sub(P.A,P.D);
 const sides=[dist(P.A,P.B),dist(P.B,P.C),dist(P.C,P.D),dist(P.D,P.A)];
 if(!parallel(AB,CD)||!parallel(BC,DA)) throw new Error(`geometry:${kind}:parallel`);
 if((kind==='rectangle'||kind==='square')&&!perp(AB,BC)) throw new Error(`geometry:${kind}:right`);
 if((kind==='rhombus'||kind==='square')&&!(approx(sides[0],sides[1])&&approx(sides[1],sides[2])&&approx(sides[2],sides[3]))) throw new Error(`geometry:${kind}:equal-sides`);
 if(kind==='rectangle'||kind==='square'){if(!approx(dist(P.A,P.C),dist(P.B,P.D)))throw new Error(`geometry:${kind}:equal-diagonals`)}
 if(kind==='rhombus'||kind==='square'){if(!perp(V.sub(P.C,P.A),V.sub(P.D,P.B)))throw new Error(`geometry:${kind}:perp-diagonals`)}
}
Object.entries(MODELS).forEach(([k,p])=>validateModel(k,p));
function slash(a,b,t,count,cls){const c=pt(a,b,t),u=unit(V.sub(b,a)),n=normal(a,b),gap=7;let out='';for(let i=0;i<count;i++){const sh=(i-(count-1)/2)*gap;const q=V.add(c,V.mul(u,sh));out+=`<line class="${cls}" x1="${q[0]-n[0]*7}" y1="${q[1]-n[1]*7}" x2="${q[0]+n[0]*7}" y2="${q[1]+n[1]*7}"/>`}return out}
function chevrons(a,b,count){const m=V.mid(a,b),u=unit(V.sub(b,a)),n=normal(a,b);let out='';for(let k=0;k<count;k++){const sh=(k-(count-1)/2)*10,c=V.add(m,V.mul(u,sh));out+=`<path class="par" d="M ${c[0]-u[0]*8-n[0]*5} ${c[1]-u[1]*8-n[1]*5} L ${c[0]} ${c[1]} L ${c[0]-u[0]*8+n[0]*5} ${c[1]-u[1]*8+n[1]*5}"/>`}return out}
function projection(p,a,b){const ab=V.sub(b,a),t=V.dot(V.sub(p,a),ab)/V.dot(ab,ab);return {q:V.add(a,V.mul(ab,t)),t}}
function angleArc(vertex,a,b,r=24){const u=unit(V.sub(a,vertex)),v=unit(V.sub(b,vertex));const p1=V.add(vertex,V.mul(u,r)),p2=V.add(vertex,V.mul(v,r));return `<path class="arc" d="M ${p1[0]} ${p1[1]} Q ${vertex[0]} ${vertex[1]} ${p2[0]} ${p2[1]}"/>`}
function rightMark(p,u,v,size=12,cls='right'){const a=unit(u),b=unit(v),p1=V.add(p,V.mul(a,size)),p2=V.add(p1,V.mul(b,size)),p3=V.add(p,V.mul(b,size));return `<path class="${cls}" d="M ${p1[0]} ${p1[1]} L ${p2[0]} ${p2[1]} L ${p3[0]} ${p3[1]}"/>`}
function svg(kind,opts={}){
 const P=MODELS[kind], pts=[P.A,P.B,P.C,P.D].map(p=>p.join(',')).join(' '), O=V.mid(P.A,P.C);
 const label={parallelogram:'מקבילית',rectangle:'מלבן',rhombus:'מעויין',square:'ריבוע'}[kind];
 let s=`<figure class="geo"><svg viewBox="0 0 360 310" role="img" aria-label="${label} ABCD עם סימונים גאומטריים מדויקים"><polygon class="shape" points="${pts}"/>`;
 if(opts.diag)s+=`<line class="diag" x1="${P.A[0]}" y1="${P.A[1]}" x2="${P.C[0]}" y2="${P.C[1]}"/><line class="diag" x1="${P.B[0]}" y1="${P.B[1]}" x2="${P.D[0]}" y2="${P.D[1]}"/>`;
 if(opts.right){[[P.A,[18,18]],[P.B,[-18,18]],[P.C,[-18,-18]],[P.D,[18,-18]]].forEach(([p,d])=>s+=`<path class="right" d="M ${p[0]} ${p[1]+d[1]/2} L ${p[0]+d[0]/2} ${p[1]+d[1]/2} L ${p[0]+d[0]/2} ${p[1]}"/>`)}
 if(opts.equal){[[P.A,P.B],[P.B,P.C],[P.C,P.D],[P.D,P.A]].forEach(([a,b])=>s+=slash(a,b,.5,1,'tick'))}
 if(opts.oppEqual){s+=slash(P.A,P.B,.5,1,'tick')+slash(P.C,P.D,.5,1,'tick')+slash(P.B,P.C,.5,2,'tick')+slash(P.D,P.A,.5,2,'tick')}
 if(opts.parallel){s+=chevrons(P.A,P.B,1)+chevrons(P.C,P.D,1)+chevrons(P.B,P.C,2)+chevrons(P.D,P.A,2)}
 if(opts.perp)s+=rightMark(O,V.sub(P.A,O),V.sub(P.B,O),12);
 if(opts.midpoints&&opts.diag){s+=slash(P.A,P.C,.27,1,'mid-a')+slash(P.A,P.C,.73,1,'mid-a')+slash(P.B,P.D,.27,2,'mid-b')+slash(P.B,P.D,.73,2,'mid-b')}
 if(opts.equalDiags&&opts.diag){s+=slash(P.A,P.C,.19,1,'diag-eq')+slash(P.B,P.D,.19,1,'diag-eq')}
 if(opts.angleBisectors&&opts.diag){s+=angleArc(P.A,P.B,O,25)+angleArc(P.A,O,P.D,25)+angleArc(P.C,P.D,O,25)+angleArc(P.C,O,P.B,25);if(opts.angleBisectors!=='ac')s+=angleArc(P.B,P.A,O,25)+angleArc(P.B,O,P.C,25)+angleArc(P.D,P.C,O,25)+angleArc(P.D,O,P.A,25)}
 if(opts.height){const {q,t}=projection(P.C,P.A,P.B);if(t<0||t>1)s+=`<line class="extension" x1="${P.A[0]}" y1="${P.A[1]}" x2="${q[0]}" y2="${q[1]}"/>`;s+=`<line class="height" x1="${P.C[0]}" y1="${P.C[1]}" x2="${q[0]}" y2="${q[1]}"/>`+rightMark(q,V.sub(P.A,q),V.sub(P.C,q),10)+`<text class="lbl" x="${(P.C[0]+q[0])/2+8}" y="${(P.C[1]+q[1])/2}">h</text>`}
 if(opts.center)s+=`<circle class="center" cx="${O[0]}" cy="${O[1]}" r="4"/><text class="lbl" x="${O[0]+8}" y="${O[1]-8}">O</text>`;
 [['A',P.A,-14,-8],['B',P.B,8,-8],['C',P.C,8,22],['D',P.D,-18,22]].forEach(([t,p,dx,dy])=>s+=`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="3"/><text class="lbl" x="${p[0]+dx}" y="${p[1]+dy}">${t}</text>`);
 return s+`</svg></figure>`;
}
const GEO=(k,o)=>svg(k,o);
const box=(cls,title,html)=>`<section class="box ${cls}">${title?`<h2>${title}</h2>`:""}${html}</section>`;
const st=x=>`<p class="statement">${x}</p>`;
const page=(t,n,title,sub,html)=>`<article class="sheet" data-t="${t}" data-page="${n}"><span class="num">${n}</span><div class="kicker">שאלות מתוך תוכנית הלימודים</div><h1 class="title">${title}</h1><div class="stack">${html}</div><div class="footer">${n}</div></article>`;
const topics={
parallelogram:{label:'מקבילית',t:'p',pages:[
()=>page('p',1,'מקבילית','',
  box('def','',st(`הגדרה: מקבילית הוא מרובע בעל שני זוגות של צלעות נגדיות ${B('long')} זו לזו.`))+
  st(`המרובע ${M('ABCD')} הוא מקבילית:`)+
  `<div class="grid2">
    ${GEO('parallelogram',{parallel:true,oppEqual:true})}
    ${box('prop','תכונות המקבילית:',
      st(`במקבילית כל זוג צלעות ${B()} מקבילות זו לזו (לפי ההגדרה).`)+
      `<div class="source-symbolic">
        <div><bdi dir="ltr">AB</bdi> ${B('short')} <bdi dir="ltr">CD</bdi></div>
        <div class="and">וגם</div>
        <div><bdi dir="ltr">AD</bdi> ${B('short')} <bdi dir="ltr">BC</bdi></div>
      </div>`+
      st(`במקבילית כל שתי ${B()} נגדיות שוות זו לזו.`)+
      `<div class="source-symbolic">
        <div><bdi dir="ltr">AB</bdi> = ${B('short')}</div>
        <div class="and">וגם</div>
        <div><bdi dir="ltr">AD</bdi> = ${B('short')}</div>
      </div>`
    )}
  </div>`
),

const root=document.getElementById('root');Object.entries(topics).forEach(([id,t],i)=>{const sec=document.createElement('section');sec.id=id;sec.className='topic'+(i===0?' active':'');sec.innerHTML=`<div class="pages">${t.pages.map(f=>`<div class="sheet-shell">${f()}</div>`).join('')}</div>`;root.appendChild(sec)});function fitWorksheetDensity(){
  document.querySelectorAll('.sheet').forEach(sheet=>{
    sheet.classList.remove('fit-airy','fit-compact','fit-dense');
    const stack=sheet.querySelector('.stack');
    if(!stack)return;
    const available=stack.clientHeight;
    let used=stack.scrollHeight;
    if(!available||!used)return;
    if(used>available*1.08){
      sheet.classList.add('fit-compact');
      used=stack.scrollHeight;
      if(used>stack.clientHeight*1.04) sheet.classList.add('fit-dense');
    }else if(used<available*.62){
      sheet.classList.add('fit-airy');
      if(stack.scrollHeight>stack.clientHeight*1.02) sheet.classList.remove('fit-airy');
    }
  });
}
function fitA4Pages(){
  fitWorksheetDensity();
  const mobile=window.matchMedia('(max-width:800px)').matches;
  document.querySelectorAll('.sheet-shell').forEach(shell=>{
    const sheet=shell.querySelector('.sheet');
    if(!sheet)return;
    if(mobile){
      const available=Math.max(280,window.innerWidth-12);
      const scale=Math.min(1,available/794);
      sheet.style.transform=`scale(${scale})`;
      shell.style.width=(794*scale)+'px';
      shell.style.height=(1123*scale)+'px';
    }else{
      sheet.style.transform='';
      shell.style.width='';
      shell.style.height='';
    }
  });
}
fitA4Pages();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitA4Pages);
window.addEventListener('beforeprint',fitWorksheetDensity);
window.addEventListener('resize',fitA4Pages,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(fitA4Pages,100),{passive:true});
document.querySelectorAll('.top button[data-id]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.top button[data-id]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.topic').forEach(x=>x.classList.toggle('active',x.id===b.dataset.id));window.scrollTo({top:0,behavior:'smooth'});requestAnimationFrame(fitA4Pages)});
