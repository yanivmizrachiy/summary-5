<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7fbff">
<meta name="description" content="סיכום שבועי — הדרכה במחוז ירושלים והעיר ירושלים, מנח״י">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="סיכום שבועי">
<link rel="icon" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<title>סיכום שבועי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@600;700;800&family=Noto+Sans+Hebrew:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   1 · משתני עיצוב — שינוי כאן משפיע על כל האתר
   ══════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;

  /* צבעים */
  --ink:#17364e;
  --muted:#60798b;
  --blue:#2f69a5;
  --blue-deep:#173e62;
  --turq:#17bdb5;
  --turq-deep:#0d7873;
  --line:rgba(23,62,98,.12);
  --paper:#fff;
  --shadow:0 13px 26px rgba(23,62,98,.10),0 2px 0 rgba(255,255,255,.88) inset;

  /* רווחים — הגדלת ערך כאן מרווחת את כל הדף בבת אחת */
  --gap-items:15px;      /* רווח בין כרטיסי הפריטים          */
  --gap-lead:.7em;       /* רווח אחרי המשפט המודגש בכל פסקה  */
  --gap-links:16px;      /* רווח בין קישור לקישור            */
  --pad-card:18px 16px;  /* ריפוד בתוך כרטיס פריט            */
  --leading:1.9;         /* גובה שורה בטקסט הפריטים          */
}

/* ══════════════════════════════════════════════════════════════════
   2 · בסיס
   ══════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
html{
  scroll-behavior:smooth;
  background:#eaf2f7;
  font-size:18px;
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  min-width:320px;
  overflow-x:hidden;
  color:var(--ink);
  font-family:'Noto Sans Hebrew',Arial,sans-serif;
  background:#eaf2f7;
  -webkit-tap-highlight-color:rgba(23,189,181,.16);
}
.document{width:100%;max-width:794px;margin:0 auto}

/* גיליון בודד. במסך רחב הוא הופך לדף A4 */
.sheet{
  position:relative;
  width:100%;
  min-height:100svh;
  overflow:hidden;
  padding-top:20px;
  padding-bottom:34px;
  padding-right:max(16px,env(safe-area-inset-right));
  padding-left:max(16px,env(safe-area-inset-left));
}

/* ══════════════════════════════════════════════════════════════════
   3 · נייד — פס התקדמות וניווט בין הדפים
   ══════════════════════════════════════════════════════════════════ */
.progress{
  position:fixed;inset:0 0 auto;height:3px;z-index:61;
  background:rgba(23,62,98,.07);
  pointer-events:none;
}
.progress>span{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--turq),var(--blue));
}
.pager{
  position:fixed;z-index:60;
  left:50%;translate:-50% 0;
  bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:2px;
  padding:0 8px;
  border-radius:999px;
  background:rgba(255,255,255,.80);
  border:1px solid rgba(255,255,255,.92);
  box-shadow:0 10px 30px rgba(23,62,98,.17);
  backdrop-filter:blur(18px) saturate(1.35);
  -webkit-backdrop-filter:blur(18px) saturate(1.35);
}
.pager button{
  position:relative;
  width:28px;height:40px;
  padding:0;border:0;background:none;
  cursor:pointer;
  touch-action:manipulation;
}
.pager button::before{
  content:"";position:absolute;top:50%;left:50%;translate:-50% -50%;
  width:9px;height:9px;border-radius:999px;
  background:rgba(23,62,98,.24);
  transition:width .28s ease,background .28s ease;
}
.pager button[aria-current="true"]::before{
  width:22px;
  background:linear-gradient(90deg,var(--turq-deep),var(--blue));
}
@media(min-width:760px){.progress,.pager{display:none}}

/* ══════════════════════════════════════════════════════════════════
   4 · שער
   ══════════════════════════════════════════════════════════════════ */
.cover{
  display:flex;flex-direction:column;justify-content:space-between;gap:18px;
  min-height:100svh;
  background:
    radial-gradient(circle at 12% 8%,rgba(24,189,181,.18),transparent 34%),
    radial-gradient(circle at 90% 88%,rgba(45,104,167,.13),transparent 36%),
    linear-gradient(160deg,#fff 0%,#f8fdfd 55%,#f3f7ff 100%);
}
.datebar{
  display:flex;direction:ltr;align-items:center;justify-content:space-between;
  gap:12px;padding:13px 15px;
  border:1px solid var(--line);border-radius:18px;
  background:rgba(255,255,255,.90);
  box-shadow:var(--shadow);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.date-gregorian{
  direction:ltr;text-align:left;color:#577184;
  font:800 clamp(.86rem,3.6vw,1rem)/1.25 Assistant,'Noto Sans Hebrew',Arial;
}
.date-hebrew{
  direction:rtl;text-align:right;color:var(--blue-deep);
  font:900 clamp(.86rem,3.6vw,1rem)/1.35 'Noto Sans Hebrew',Arial;
  text-wrap:balance;
}
/* בס״ד — אחריו רווח בלבד, ללא נקודה */
.bsd{margin-inline-end:.15em}

.cover-main{
  flex:1;display:flex;flex-direction:column;justify-content:space-evenly;
  align-items:center;text-align:center;padding:12px 0 16px;
}
.cover-logo{
  width:132px;height:132px;object-fit:cover;border-radius:50%;
  border:2px solid rgba(45,104,167,.55);background:#fff;
  box-shadow:0 0 0 9px rgba(45,104,167,.045),0 20px 46px rgba(23,62,98,.15);
  animation:logoTurn 12s linear infinite;
  will-change:transform;
}
.cover h1{
  margin:0;color:var(--blue-deep);
  font:900 clamp(2.7rem,12vw,4rem)/1 Assistant,'Noto Sans Hebrew',Arial;
  letter-spacing:-.03em;
}
.edition{margin:10px 0 0;color:#496c88;font:800 1.14rem/1.25 Assistant,'Noto Sans Hebrew',Arial}
.district{
  max-width:640px;margin:0;color:#31556e;
  font:800 1.12rem/1.72 'Noto Sans Hebrew',Arial;
  text-wrap:balance;
}
.district span{display:block}
.district-lead{margin-top:10px}

/* ══════════════════════════════════════════════════════════════════
   5 · דפי תוכן — כותרת עמוד ופרטי הכותב
   ══════════════════════════════════════════════════════════════════ */
.page{background:linear-gradient(180deg,#fff 0%,#f8fbfd 100%)}
.summary-page{background:linear-gradient(180deg,#fffdf7 0%,#f7fcff 100%)}
.teaching-page{background:linear-gradient(180deg,#f7f7ff 0%,#eef8ff 100%)}
.workbook-page{background:linear-gradient(180deg,#f2fff9 0%,#f8fbff 100%)}

.page-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:0 0 18px;padding:15px;
  border:1px solid rgba(255,255,255,.95);border-radius:20px;
  background:rgba(255,255,255,.82);
  box-shadow:0 9px 22px rgba(23,62,98,.07);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.page-title,.hello{
  margin:0;color:var(--blue-deep);
  font:900 clamp(2.05rem,9vw,3.1rem)/1.06 Assistant,'Noto Sans Hebrew',Arial;
  text-wrap:balance;
}
.author{display:flex;align-items:center;gap:10px;text-align:right}
.author img{
  width:66px;height:66px;object-fit:cover;border-radius:50%;
  border:3px solid #fff;box-shadow:0 9px 22px rgba(23,62,98,.14);
}
.author-txt strong,.author-txt span{display:block}
.author-txt strong{color:var(--blue-deep);font:900 1rem/1.2 Assistant,'Noto Sans Hebrew',Arial}
.author-txt span{max-width:205px;color:var(--muted);font:750 .82rem/1.45 'Noto Sans Hebrew',Arial}

/* ══════════════════════════════════════════════════════════════════
   6 · פריטי הסיכום
   ══════════════════════════════════════════════════════════════════ */
.summary-grid{display:flex;flex-direction:column;gap:var(--gap-items)}
.future-heading{
  margin:28px 2px 12px;color:var(--blue-deep);
  font:900 clamp(1.8rem,7vw,2.45rem)/1.1 Assistant,'Noto Sans Hebrew',Arial;
}
.item{
  display:grid;grid-template-columns:20px minmax(0,1fr);gap:11px;align-items:start;
  padding:var(--pad-card);
  border:1px solid rgba(23,62,98,.09);border-radius:18px;
  background:rgba(255,255,255,.94);
  box-shadow:0 12px 24px rgba(23,62,98,.09),
             0 1px 0 rgba(255,255,255,.95) inset,
             0 -1px 0 rgba(23,62,98,.03) inset;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.item-text{
  margin:0;color:#21465f;
  font:650 1.02rem/var(--leading) 'Noto Sans Hebrew',Arial;
  text-wrap:pretty;
}
.item-text strong{color:var(--blue-deep);font-weight:900}

/* המשפט המודגש יושב בשורה נפרדת, וגוף הפסקה מתחתיו */
.item-lead{display:block;color:var(--blue-deep);font-weight:900;line-height:1.6}
.item-body{display:block;margin-top:var(--gap-lead)}

/* קישורים שמופיעים כרשימה מתחת לפסקה */
.item-links{display:flex;flex-direction:column;gap:var(--gap-links);margin-top:var(--gap-links)}
.item-links a{display:inline-block;align-self:flex-start}

.orb{
  width:18px;height:18px;margin-top:.52em;border-radius:50%;
  background:conic-gradient(from 0deg,#0c7772,#18bdb5,#c8fff9,#5a86bf,#0c7772);
  box-shadow:0 0 0 4px rgba(24,189,181,.08),0 7px 15px rgba(12,119,114,.13);
  animation:orbSpin 3s linear infinite;
  will-change:rotate;
}
.link{
  color:var(--turq-deep);font-weight:900;
  text-decoration-thickness:2px;text-underline-offset:3px;
  padding-block:.14em;
}

/* ══════════════════════════════════════════════════════════════════
   7 · גרפיקה — סימון מרקר צהוב וסימון עט אדום
   ══════════════════════════════════════════════════════════════════ */
.marker,.hl{position:relative;isolation:isolate}
.hl{display:inline-block;padding:.02em .14em;font-weight:800}
.marker::before,.hl::before{
  content:"";position:absolute;z-index:-1;inset:1px -5px;
  background:linear-gradient(96deg,
    rgba(255,236,84,.48),
    rgba(255,247,164,.72) 55%,
    rgba(255,229,74,.45));
  border-radius:var(--r1,8px) var(--r2,15px) var(--r3,10px) var(--r4,13px);
  rotate:var(--rot,-.35deg);
  box-shadow:0 0 18px rgba(255,222,54,.20);
}
.pen-mark{
  position:relative;display:inline-block;
  padding:.02em .16em;font-weight:900;white-space:nowrap;
}
.pen-mark svg{
  position:absolute;pointer-events:none;overflow:visible;
  left:-.36em;top:-.29em;
  width:calc(100% + .72em);height:calc(100% + .56em);
}
.pen-mark path{
  fill:none;stroke:#dc2626;stroke-width:2.7;
  stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
  stroke-dasharray:1;
  stroke-dashoffset:0;          /* ברירת המחדל: העיגול מצויר ונראה */
}
.pen-mark .rough2{opacity:.42;stroke-width:1.5;translate:.7px -.4px}

/* הקוד מוסיף pen-anim רק כשאפשר להנפיש. אז העיגול מתחיל מוסתר,
   ונמשך ברגע שהוא נכנס לתוך המסך. אם משהו משתבש, הכלל למעלה
   מבטיח שהעיגול פשוט יופיע מצויר. */
.pen-mark.pen-anim path{stroke-dashoffset:1}
.pen-mark.pen-draw path{animation:drawPen .95s ease-out forwards}
.pen-mark.pen-draw .rough2{animation-delay:.1s}

/* ══════════════════════════════════════════════════════════════════
   8 · טבלת "מה אנחנו מלמדים"
   ══════════════════════════════════════════════════════════════════ */
.teaching-page{display:flex;flex-direction:column}
.table-wrap{flex:1;display:flex}
.teach-table{
  width:100%;border-collapse:separate;border-spacing:0;
  overflow:hidden;border-radius:20px;box-shadow:var(--shadow);background:#fff;
}
.teach-table th{
  padding:13px 9px;
  background:linear-gradient(135deg,#2d68a7,#0c7772);
  color:#fff;font:900 .96rem/1.2 Assistant,'Noto Sans Hebrew',Arial;text-align:center;
}
.teach-table th.c1{background:linear-gradient(135deg,#0c7772,#19a9a2)}
.teach-table th.c2{background:linear-gradient(135deg,#315d9a,#557bb5)}
.teach-table td{
  padding:16px 13px;border-bottom:1px solid var(--line);vertical-align:middle;
  color:#274d65;font:700 .95rem/1.7 'Noto Sans Hebrew',Arial;
}
.teach-table td:first-child{width:17%;text-align:center;color:var(--blue-deep);font-weight:900}
.teach-table td.c1{background:#effbf9}
.teach-table td.c2{background:#eef4ff}
.teach-table tbody tr:last-child td{border-bottom:0}

/* ══════════════════════════════════════════════════════════════════
   9 · חוברות עבודה
   ══════════════════════════════════════════════════════════════════ */
.workbook-page{display:flex;flex-direction:column}
.workbook-list{
  flex:1;
  display:flex;flex-direction:column;justify-content:center;
  gap:var(--gap-workbooks,18px);
}
/* ── כפתור אחד לכל חוברת ──
   כל כפתור מקבל גוון משלו לפי מיקומו ברשימה. הצבעים מתחלפים במחזור
   של חמישה, כך שחוברת חדשה מקבלת את הגוון הבא אוטומטית. */
.workbook-list .btn:nth-child(5n+1){--c1:#0a6660;--c2:#17a99d;--glow:rgba(23,169,157,.45)}
.workbook-list .btn:nth-child(5n+2){--c1:#1a3c6e;--c2:#4079c4;--glow:rgba(64,121,196,.45)}
.workbook-list .btn:nth-child(5n+3){--c1:#472768;--c2:#7d4fb0;--glow:rgba(125,79,176,.45)}
.workbook-list .btn:nth-child(5n+4){--c1:#7a1f3d;--c2:#bf3f64;--glow:rgba(191,63,100,.45)}
.workbook-list .btn:nth-child(5n+5){--c1:#8a5a0f;--c2:#d09832;--glow:rgba(208,152,50,.45)}

.btn{
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  width:100%;min-height:84px;padding:18px 22px;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.16);
  background:
    linear-gradient(162deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,0) 46%),
    linear-gradient(135deg,var(--c1,#0c7772),var(--c2,#2d68a7));
  color:#fff;text-decoration:none;
  font:900 clamp(1.22rem,5.4vw,1.6rem)/1.3 Assistant,'Noto Sans Hebrew',Arial;
  text-wrap:balance;
  box-shadow:
    0 18px 34px -12px var(--glow,rgba(45,104,167,.4)),
    0 8px 18px rgba(8,26,45,.20),
    inset 0 1px 0 rgba(255,255,255,.34),
    inset 0 -1px 0 rgba(0,0,0,.18),
    inset 0 0 0 1px rgba(255,214,140,.20);   /* קו זהב דק */
  touch-action:manipulation;
  transition:transform .22s ease,box-shadow .22s ease;
}
/* ברק זכוכית שחולף על הכפתור */
.btn::after{
  content:"";position:absolute;inset:-60% -25%;pointer-events:none;
  background:linear-gradient(104deg,
    transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%);
  transform:translateX(-130%);
  animation:btnShine 8s ease-in-out infinite;
}
.workbook-list .btn:nth-child(2)::after{animation-delay:.9s}
.workbook-list .btn:nth-child(3)::after{animation-delay:1.8s}
.workbook-list .btn:nth-child(4)::after{animation-delay:2.7s}
.workbook-list .btn:nth-child(5)::after{animation-delay:3.6s}

.btn-label{flex:1;text-align:start}
/* עיגול עם חץ בקצה הכפתור */
.btn-go{
  flex:none;display:grid;place-items:center;
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.30);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32);
}
.btn-go::before{
  content:"";width:9px;height:9px;margin-inline-start:4px;
  border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;
  rotate:45deg;
}
@media(hover:hover){
  .btn:hover{
    transform:translateY(-3px);
    box-shadow:
      0 26px 44px -14px var(--glow,rgba(45,104,167,.5)),
      0 10px 22px rgba(8,26,45,.24),
      inset 0 1px 0 rgba(255,255,255,.40),
      inset 0 -1px 0 rgba(0,0,0,.18),
      inset 0 0 0 1px rgba(255,214,140,.34);
  }
}
.btn:active{transform:translateY(1px) scale(.995)}

/* ══════════════════════════════════════════════════════════════════
   10 · דף הסיום — תמונה מונפשת בסגנון סרטון
   ══════════════════════════════════════════════════════════════════ */
.sheet.finale{
  display:flex;align-items:flex-end;
  padding:0;                       /* התמונה ממלאת את הדף מקצה לקצה */
  min-height:100svh;
  overflow:hidden;
  background:#0a1e36;
  isolation:isolate;
}
/* התמונה זזה לאט פנימה והחוצה, כמו מצלמה שנעה */
.finale-img{
  position:absolute;inset:0;z-index:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center;
  animation:kenBurns 26s ease-in-out infinite alternate;
  will-change:transform;
}
/* הבזק אור שחולף על התמונה */
.finale-sweep{
  position:absolute;inset:-40% -60%;z-index:1;pointer-events:none;
  background:linear-gradient(104deg,
    transparent 40%,
    rgba(255,255,255,.30) 47%,
    rgba(255,238,190,.16) 52%,
    transparent 60%);
  mix-blend-mode:screen;
  animation:sweep 9s ease-in-out infinite;
  will-change:transform;
}
/* ניצוצות מנצנצים */
.spark{
  position:absolute;z-index:2;width:12px;height:12px;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,231,160,.55) 34%,transparent 70%);
  animation:twinkle 3.4s ease-in-out infinite;
  will-change:transform,opacity;
}
.spark::before,.spark::after{
  content:"";position:absolute;top:50%;left:50%;translate:-50% -50%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
}
.spark::before{width:34px;height:1.5px}
.spark::after{width:1.5px;height:34px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.9),transparent)}
.s1{top:14%;right:18%;animation-delay:0s}
.s2{top:27%;left:12%;animation-delay:.9s;scale:.8}
.s3{top:52%;right:9%;animation-delay:1.7s;scale:1.15}
.s4{top:63%;left:22%;animation-delay:2.4s;scale:.7}
.s5{top:38%;left:30%;animation-delay:1.2s;scale:.9}
.s6{top:74%;right:30%;animation-delay:3s;scale:.85}
/* כיתוב הסיום, על הצללה כדי שייקרא תמיד */
.finale-caption{
  position:relative;z-index:3;width:100%;
  padding:140px 20px calc(92px + env(safe-area-inset-bottom));
  text-align:center;
  background:linear-gradient(to top,
    rgba(4,18,36,.94) 0%,
    rgba(4,18,36,.78) 36%,
    rgba(4,18,36,.30) 68%,
    transparent 100%);
  animation:captionIn 1.5s cubic-bezier(.2,.75,.2,1) both;
}
.finale-caption p{
  margin:0;
  font:900 clamp(2.3rem,10.5vw,3.7rem)/1.18 Assistant,'Noto Sans Hebrew',Arial;
  letter-spacing:-.02em;text-wrap:balance;
  background:linear-gradient(100deg,#fff 0%,#ffeeba 26%,#f3c75a 44%,#fff6d8 62%,#ffe7a8 100%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  filter:drop-shadow(0 3px 14px rgba(0,0,0,.6)) drop-shadow(0 0 30px rgba(255,199,88,.38));

<script>
(function(){
  "use strict";
  var S = SUMMARY;

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  /* מחולל אקראיות קבוע לפי טקסט: כל סימון נראה מעט שונה, אבל תמיד אותו דבר */
  function seeded(str){
    var h = 2166136261;
    for (var i = 0; i < str.length; i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return function(){
      h ^= h << 13; h >>>= 0;
      h ^= h >>> 17;
      h ^= h << 5;  h >>>= 0;
      return h / 4294967296;
    };
  }

  function penMark(text){
    var w   = Math.max(96, Math.round(72 + 6 * text.length));
    var rnd = seeded(text);
    var j   = function(v, a){ return Math.round((v + (rnd() * 2 - 1) * a) * 10) / 10; };
    var sx  = j(6, .8), sy = j(23, .8);

    var main = "M" + sx + " " + sy +
      " C" + j(w/30+5, 1.4)     + " " + j(5, 1.2)  +
      ", "  + j(.8833*w-8, 3)   + " " + j(2, 1.2)  +
      ", "  + j(.9833*w-4, 2)   + " " + j(18, 1.2) +
      " C" + j(1.0333*w-3, 2)   + " " + j(34, 1.2) +
      ", "  + j(.15*w+4, 3)     + " " + j(42, 1.2) +
      ", "  + j(5, .8)          + " " + j(27, .8)  +
      " C" + j(2, .8)           + " " + j(24, .8)  +
      ", "  + j(2, .8)          + " " + j(21, .8)  +
      ", "  + sx + " " + sy;

    var rough = "M" + j(8, .8) + " " + j(24, .8) +
      " C" + j(.0333*w+8, 1.4) + " " + j(7, 1.2)  +
      ", "  + j(.8833*w-6, 3)  + " " + j(4, 1.2)  +
      ", "  + j(.9833*w-6, 2)  + " " + j(19, 1.2) +
      " C" + j(1.0167*w-5, 2)  + " " + j(32, 1.2) +
      ", "  + j(.15*w+6, 3)    + " " + j(39, 1.2) +
      ", "  + j(7, .8)         + " " + j(27, .8);

    return '<span class="pen-mark">' + text +
           '<svg viewBox="0 0 ' + w + ' 42" preserveAspectRatio="none" aria-hidden="true">' +
           '<path pathLength="1" d="' + main + '"/>' +
           '<path class="rough2" pathLength="1" d="' + rough + '"/>' +
           '</svg></span>';
  }

  /* סימון מרקר: פינות וזווית מעט שונות בכל מופע */

    var rnd = seeded(text);
    var r   = function(){ return Math.round(7 + rnd() * 10); };
    return "--r1:" + r() + "px;--r2:" + r() + "px;--r3:" + r() + "px;--r4:" + r() + "px;" +
           "--rot:" + (rnd() * 1.2 - .75).toFixed(2) + "deg";
  }

  /* המרת הסימונים הפשוטים ל־HTML */
  function rich(s){
    var h = esc(s);
    h = h.replace(/==([^=]+)==/g, function(m, t){
      return '<span class="hl" style="' + markerStyle(t) + '">' + t + "</span>";
    });
    h = h.replace(/\[\[([^\]]+)\]\]/g, function(m, t){ return penMark(t); });
    h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/\[([^\][]+)\]\(([^)\s]+)\)/g, function(m, t, u){
      return '<a class="link" href="' + u + '" target="_blank" rel="noopener noreferrer">' + t + "</a>";
    });
    return h;
  }

  function linkHTML(l){
    return '<a class="link" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' +
           esc(l.text) + "</a>";
  }

  /* פריט בודד. משפט מודגש בפתיחה יורד לשורה נפרדת והגוף מתחתיו */
  function itemHTML(item){
    var text = (item.text || "").trim();
    var html = "";
    var lead = text.match(/^\*\*([^*]+)\*\*\s*/);

    if (lead){
      html += '<strong class="item-lead">' + rich(lead[1]) + "</strong>";
      text  = text.slice(lead[0].length);
    }
    if (text)  html += '<span class="item-body">' + rich(text) + "</span>";
    if (item.links && item.links.length){
      html += '<span class="item-links">' + item.links.map(linkHTML).join("") + "</span>";
    }

    return '<div class="item"><span class="orb" aria-hidden="true"></span>' +
           '<p class="item-text' + (item.mark ? " marker" : "") + '"' +
           (item.mark ? ' style="' + markerStyle(item.text) + '"' : "") + ">" +
           html + "</p></div>";
  }

  var t = S.teaching, w = S.workbooks, b = S.finale;

  var pages = [

    /* דף 1 — שער */
    '<section class="sheet cover" aria-label="שער הסיכום השבועי">' +
      '<div class="datebar">' +
        '<div class="date-gregorian" dir="ltr">' + esc(S.dateGregorian) + "</div>" +
        '<div class="date-hebrew"><span class="bsd">בס״ד</span> ' + esc(S.dateHebrew) + "</div>" +
      "</div>" +
      '<div class="cover-main">' +
        '<img class="cover-logo" src="' + esc(S.cover.logo) + '" alt="' + esc(S.cover.title) +
          '" width="132" height="132" decoding="async" fetchpriority="high">' +
        "<div><h1>" + esc(S.cover.title) + '</h1><p class="edition">' + esc(S.cover.edition) + "</p></div>" +
        '<p class="district"><span>' + esc(S.cover.district) + "</span>" +
          '<span class="district-lead">' + esc(S.cover.lead) + "</span></p>" +
      "</div>" +
    "</section>",

    /* דף 2 — עדכוני השבוע ומה צפוי */
    '<section class="sheet page summary-page" aria-label="עדכוני השבוע ומה צפוי">' +
      '<div class="page-head">' +
        '<h2 class="hello">' + esc(S.greeting) + "</h2>" +
        '<div class="author">' +
          '<img src="' + esc(S.author.photo) + '" alt="' + esc(S.author.name) +
            '" width="66" height="66" decoding="async">' +
          '<div class="author-txt"><strong>' + esc(S.author.name) + "</strong>" +
            "<span>" + esc(S.author.role) + "</span></div>" +
        "</div>" +
      "</div>" +
      '<div class="summary-grid">' +
        S.thisWeek.map(itemHTML).join("") +
        '<h2 class="future-heading">' + esc(S.futureHeading) + "</h2>" +
        S.comingUp.map(itemHTML).join("") +
      "</div>" +
    "</section>",

    /* דף 3 — מה אנחנו מלמדים */
    '<section class="sheet page teaching-page" aria-label="' + esc(t.title) + '">' +
      '<div class="page-head"><h2 class="page-title">' + esc(t.title) + "</h2></div>" +
      '<div class="table-wrap"><table class="teach-table">' +
        "<thead><tr><th>" + esc(t.columns[0]) + "</th>" +
          '<th class="c1">' + esc(t.columns[1]) + "</th>" +
          '<th class="c2">' + esc(t.columns[2]) + "</th></tr></thead><tbody>" +
        t.rows.map(function(r){
          return "<tr><td>" + esc(r[0]) + "</td>" +
                 '<td class="c1" data-label="' + esc(t.columns[1]) + '">' + esc(r[1]) + "</td>" +
                 '<td class="c2" data-label="' + esc(t.columns[2]) + '">' + esc(r[2]) + "</td></tr>";
        }).join("") +
      "</tbody></table></div>" +
    "</section>",

    /* דף 4 — חוברות העבודה */
    '<section class="sheet page workbook-page" aria-label="' + esc(w.title) + '">' +
      '<div class="page-head"><h2 class="page-title">' + esc(w.title) + "</h2></div>" +
      '<div class="workbook-list">' +
        w.list.map(function(bk){
          return '<a class="btn" href="' + esc(bk.url) + '" target="_blank" rel="noopener noreferrer">' +
                 '<span class="btn-label">' + esc(bk.topic) + "</span>" +
                 '<span class="btn-go" aria-hidden="true"></span></a>';
        }).join("") +
      "</div>" +
    "</section>",

    /* דף 5 — סיום מונפש */
    '<section class="sheet finale" aria-label="' + esc(b.text) + '">' +
      '<img class="finale-img" src="' + esc(b.image) + '" alt="' + esc(b.alt) +
        '" width="1055" height="1491" decoding="async">' +
      '<span class="finale-sweep" aria-hidden="true"></span>' +
      '<span class="spark s1" aria-hidden="true"></span>' +
      '<span class="spark s2" aria-hidden="true"></span>' +
      '<span class="spark s3" aria-hidden="true"></span>' +
      '<span class="spark s4" aria-hidden="true"></span>' +
      '<span class="spark s5" aria-hidden="true"></span>' +
      '<span class="spark s6" aria-hidden="true"></span>' +
      '<div class="finale-caption"><p>' + esc(b.text) + "</p></div>" +
    "</section>"
  ];

  document.getElementById("doc").innerHTML = pages.join("\n");

  /* כותרת הלשונית ותיאור הדף נגזרים מהתאריך שלמעלה */
  document.title = S.cover.title + " | " + S.dateHebrew;
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute("content", S.cover.title + " — " + S.dateHebrew);

  /* ───── ציור העיגולים האדומים ─────
     כל עיגול נמשך ברגע שהוא נכנס לתוך המסך, ונשאר מצויר אחר כך.
     הבדיקה רצה בתוך לולאת הגלילה הרגילה, כי היא פועלת גם כשהדף
     נפתח בלשונית רקע. אם הקוד לא רץ כלל, או כשמבקשים תנועה
     מופחתת, ברירת המחדל ב-CSS מציגה את העיגולים מצוירים. */
  var penMarks = [];

  if (!window.matchMedia("(prefers-reduced-motion:reduce)").matches){
    Array.prototype.forEach.call(document.querySelectorAll(".pen-mark"), function(m){
      m.classList.add("pen-anim");
      penMarks.push(m);
    });
  }

  function drawVisiblePenMarks(){
    if (!penMarks.length) return;
    var h = window.innerHeight || 0;
    penMarks = penMarks.filter(function(m){
      var r = m.getBoundingClientRect();
      if (r.bottom > 0 && r.top < h * 0.94){
        m.classList.add("pen-draw");
        /* רשת ביטחון: הציור אורך כשנייה. אחרי 1.4 שניות מסירים את שתי
           המחלקות, וכך העיגול חוזר לברירת המחדל של ה-CSS — מצויר ונראה.
           זה מבטיח שהעיגול יופיע גם אם האנימציה לא רצה בכלל. */
        setTimeout(function(){
          m.classList.remove("pen-draw");
          m.classList.remove("pen-anim");
        }, 1400);
        return false;                 /* צויר — אין צורך לבדוק שוב */
      }
      return true;
    });
  }

  /* ───── ניווט נייד: נקודות בתחתית המסך ופס התקדמות למעלה ───── */
  var sections = Array.prototype.slice.call(document.querySelectorAll("section.sheet"));
  var names    = ["שער", "עדכוני השבוע", t.title.replace(/\?/g, ""), w.title, b.text];
  var pager    = document.getElementById("pager");

  pager.innerHTML = sections.map(function(s, i){
    return '<button type="button" aria-label="' + esc(names[i] || ("דף " + (i + 1))) + '"></button>';
  }).join("");

  var dots = Array.prototype.slice.call(pager.children);
  dots.forEach(function(d, i){
    d.addEventListener("click", function(){
      sections[i].scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });

  /* ───── התאמה אוטומטית לדף A4 ─────
     במסך רחב ובהדפסה גובה הגיליון קבוע (297 מ״מ). כאן מקטינים בהדרגה
     את תוכן הדף עד שהוא נכנס, כדי ששום דבר לא ייחתך גם כשמוסיפים
     פריטים או חוברות. בנייד הדף פשוט מתארך, ולכן אין הקטנה. */
  var wideMQ = window.matchMedia("(min-width:760px)");

  function fitPage(page, lastSelector){
    if (!page) return;
    page.style.removeProperty("--fit");
    if (!wideMQ.matches) return;

    var all = page.querySelectorAll(lastSelector);
    if (!all.length) return;

    var last = all[all.length - 1];
    var pad  = parseFloat(getComputedStyle(page).paddingBottom) || 0;
    var fit  = 1;

    function tooTall(){
      return last.getBoundingClientRect().bottom >
             page.getBoundingClientRect().bottom - pad + 0.5;
    }

    while (fit > 0.6 && tooTall()){
      fit = Math.round((fit - 0.02) * 100) / 100;
      page.style.setProperty("--fit", fit);
    }
  }

  function fitSummary(){
    fitPage(document.querySelector(".summary-page"),  ".item");
    fitPage(document.querySelector(".workbook-page"), ".workbook-list .btn");
  }

  /* אחרי שינוי גודל חלון או סיבוב מכשיר הפריסה לא מוכנה מיד, ומדידה
     מוקדמת מדי מחזירה גדלים ישנים. לכן מודדים גם עכשיו וגם שוב אחרי
     שהדפדפן סיים לפרוס מחדש.
     משתמשים ב־setTimeout ולא ב־requestAnimationFrame, כי כשהדף נפתח
     בלשונית רקע הדפדפן לא מריץ אנימציות והמדידה השנייה לא הייתה קורית. */
  var fitTimer = null;

  function scheduleFit(){
    fitSummary();
    clearTimeout(fitTimer);
    fitTimer = setTimeout(function(){
      fitSummary();
      refresh();
    }, 120);
  }

  var bar = document.querySelector(".progress > span");
  var queued = false;

  function refresh(){
    queued = false;
    drawVisiblePenMarks();
    var max = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (max > 0 ? Math.min(100, Math.max(0, window.scrollY / max * 100)) : 0) + "%";

    var active = 0;
    sections.forEach(function(s, i){
      if (s.getBoundingClientRect().top <= window.innerHeight * 0.45) active = i;
    });
    dots.forEach(function(d, i){
      d.setAttribute("aria-current", i === active ? "true" : "false");
    });
  }

  /* rAF נותן עדכון חלק, אבל הוא לא רץ כשהדף בלשונית רקע.
     לכן מוסיפים גיבוי בטיימר — מי שמגיע ראשון מרענן, השני מתבטל. */
  function onScroll(){
    if (queued) return;
    queued = true;
    var run = function(){ if (queued) refresh(); };
    if (typeof requestAnimationFrame === "function") requestAnimationFrame(run);
    setTimeout(run, 80);
  }

  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", function(){ scheduleFit(); onScroll(); }, { passive: true });
  window.addEventListener("orientationchange", scheduleFit);
  window.addEventListener("beforeprint", fitSummary);

  /* מעבר בין תצוגת נייד לתצוגת A4 — למדוד מחדש בכל חציית הסף */
  if (wideMQ.addEventListener){
    wideMQ.addEventListener("change", scheduleFit);
  }

  fitSummary();
  refresh();

  /* הגופנים נטענים מהרשת ומשנים מעט את הגבהים — מודדים שוב אחרי שהם מוכנים */
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(scheduleFit);
  }
  window.addEventListener("load", scheduleFit);

  /* דף שנפתח בלשונית רקע נמדד שוב ברגע שמסתכלים עליו */
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) scheduleFit();
  });
})();
</script>
</body>
</html>
