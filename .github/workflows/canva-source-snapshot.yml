      - name: Commit canonical snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quadrilaterals-preview/canva-source/rectangle/*.png quadrilaterals-preview/canva-source/rhombus/*.png
