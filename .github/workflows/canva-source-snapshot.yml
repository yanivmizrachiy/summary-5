name: Capture canonical Canva worksheet sources

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/canva-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Download canonical Canva page snapshots
