name: Quadrilaterals Visual A4 QA

on:
  push:
    branches:
      - codex/quadrilaterals-a4-fix
    paths:
      - "quadrilaterals-preview/index.html"
      - ".github/workflows/quadrilaterals-visual.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-a4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/quadrilaterals-a4-fix

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@latest
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            npm install --no-save playwright@latest
            npx playwright install chromium
            echo "BROWSER=playwright" >> "$GITHUB_ENV"
          else
            echo "BROWSER=$CHROME" >> "$GITHUB_ENV"
          fi

      - name: Serve site
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/a4-server.log 2>&1 &
          echo $! >/tmp/a4-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/quadrilaterals-preview/index.html >/dev/null && exit 0
            sleep 0.2
          done
          cat /tmp/a4-server.log
          exit 1

      - name: Render and measure desktop + mobile
        shell: bash
        run: |
          cat > .a4-qa.cjs <<'NODE'
          const fs=require('node:fs');
          const { chromium }=require('playwright-core');
          (async()=>{
            const executablePath = process.env.BROWSER === 'playwright' ? undefined : process.env.BROWSER;
            const browser = await chromium.launch({headless:true, executablePath, args:['--no-sandbox']});
            const url='http://127.0.0.1:8000/quadrilaterals-preview/index.html';
            const results={};

            async function inspect(name, viewport){
              const page=await browser.newPage({viewport});
              await page.goto(url,{waitUntil:'networkidle'});
              await page.evaluate(()=>document.fonts?.ready);
              await page.waitForTimeout(250);
              const rows=[];
              const topicIds=['parallelogram','rectangle','rhombus'];
              for(const topicId of topicIds){
                await page.evaluate(id=>{
                  document.querySelectorAll('.topic').forEach(x=>x.classList.toggle('active',x.id===id));
                  if(typeof fitA4Pages==='function') fitA4Pages();
                },topicId);
                await page.waitForTimeout(80);
                const pages=page.locator(`#${topicId} .sheet.source-page`);
                const count=await pages.count();
                for(let i=0;i<count;i++){
                  const sheet=pages.nth(i);
                  const metrics=await sheet.evaluate(el=>{
                    const sr=el.getBoundingClientRect();
                    const outside=[], clipped=[];
                    for(const node of el.querySelectorAll('*')){
                      const r=node.getBoundingClientRect();
                      if(r.width===0&&r.height===0) continue;
                      if(r.left < sr.left-1 || r.right > sr.right+1 || r.top < sr.top-1 || r.bottom > sr.bottom+1){
                        outside.push({tag:node.tagName,cls:node.className?.baseVal||node.className||'',text:(node.textContent||'').trim().slice(0,60)});
                      }
                      if(node instanceof HTMLElement && node.clientWidth>0 && node.scrollWidth>node.clientWidth+2){
                        clipped.push({tag:node.tagName,cls:node.className||'',text:(node.textContent||'').trim().slice(0,80),clientWidth:node.clientWidth,scrollWidth:node.scrollWidth});
                      }
                    }
                    return {
                      topic:el.dataset.t,page:el.dataset.page,
                      sheet:{width:sr.width,height:sr.height,left:sr.left,top:sr.top},
                      outside,clipped,
                      scrollHeight:el.scrollHeight,clientHeight:el.clientHeight
                    };
                  });
                  rows.push(metrics);
                }
              }
              await page.evaluate(()=>document.querySelectorAll('.topic').forEach(x=>x.classList.toggle('active',x.id==='parallelogram')));
              await page.locator('#parallelogram .sheet').first().screenshot({path:`/tmp/${name}.png`});
              await page.close();
              return rows;
            }

            results.desktop=await inspect('desktop',{width:1100,height:1350});
            results.mobile=await inspect('mobile',{width:390,height:844});
            fs.writeFileSync('/tmp/layout.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));

            const errors=[];
            for(const [mode,rows] of Object.entries(results)){
              if(rows.length!==15) errors.push(`${mode}: expected 15 source pages, got ${rows.length}`);
              for(const row of rows){
                if(mode==='desktop' && (Math.abs(row.sheet.width-794)>1 || Math.abs(row.sheet.height-1123)>1)) errors.push(`p${row.page}: desktop not 794x1123`);
                if(row.outside.length) errors.push(`p${row.page} ${mode}: outside=${row.outside.length}`);
                if(row.clipped.length) errors.push(`p${row.page} ${mode}: clipped=${row.clipped.length}`);
              }
            }
            if(errors.length){console.error(errors.join('\n'));process.exit(1);}
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node .a4-qa.cjs
          rm -f .a4-qa.cjs

      - name: Persist QA metrics
        if: always()
        shell: bash
        run: |
          mkdir -p .codex/qa
          test -f /tmp/layout.json && cp /tmp/layout.json .codex/qa/layout.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .codex/qa/layout.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "qa: persist quadrilaterals visual metrics"
          git push || true

      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadrilaterals-a4-visual-proof
          path: |
            /tmp/desktop.png
            /tmp/mobile.png
            /tmp/layout.json
          if-no-files-found: warn
