name: Autonomous Gemini & OpenAI Cloud Agent

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  agent-runner:
    if: contains(github.event.comment.body, '/fix') || contains(github.event.issue.title, '[AUTO]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Autonomous Validation & Fixes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "print('🤖 Cloud Agent Active: Processing task...')"
          if [ -f "scripts/validate_app_canonical_coverage.py" ]; then
            python scripts/validate_app_canonical_coverage.py
          fi

      - name: Auto Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto(agent): autonomous fix & validation pass"
